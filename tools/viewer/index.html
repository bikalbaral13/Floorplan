<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan Viewer</title>
<style>
:root{--bg:#f4f3f0;--panel:#fff;--ink:#1f2328;--mute:#6b7280;--line:#e2e0db;--acc:#e8590c;--btn:#efeee9}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--panel:#1e2125;--ink:#e6e6e3;--mute:#9aa0a6;--line:#2f3338;--acc:#ff8a3d;--btn:#272b30}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,Segoe UI,sans-serif}
header{display:flex;gap:8px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header b{font-size:14px;margin-right:6px}
button,select,label.btn{background:var(--btn);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px 9px;font:inherit;cursor:pointer}
button.on{background:var(--acc);border-color:var(--acc);color:#fff}
#name{color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:32ch}
.sp{flex:1}
main{display:grid;height:calc(100% - 41px);gap:1px;background:var(--line)}
main.all{grid-template-columns:minmax(220px,1fr) 2fr 2fr}
main.one{grid-template-columns:1fr}
@media (max-width:800px){main.all{grid-template-columns:1fr;grid-template-rows:1fr 1fr 1fr}}
.pane{position:relative;background:var(--panel);overflow:hidden;min-height:0}
.pane.hide{display:none}
.ptitle{position:absolute;top:6px;left:8px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);z-index:2;pointer-events:none}
#json{overflow:auto;padding:26px 8px 8px;font:12px/1.5 ui-monospace,Consolas,monospace}
#json .r{white-space:nowrap;cursor:pointer;padding-left:2px;border-radius:3px}
#json .r:hover{background:var(--btn)}
#json .r.sel{background:var(--acc);color:#fff}
#json .k{color:#7c3aed}#json .s{color:#15803d}#json .n{color:#b45309}#json .m{color:var(--mute)}
@media (prefers-color-scheme:dark){#json .k{color:#c4b5fd}#json .s{color:#86efac}#json .n{color:#fcd34d}}
#json .c{padding-left:14px}
canvas{display:block;width:100%;height:100%}
#info{position:absolute;right:8px;bottom:8px;max-width:min(320px,90%);max-height:45%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;display:none;z-index:3}
#info table{border-collapse:collapse}#info td{padding:1px 6px 1px 0;vertical-align:top}#info td:first-child{color:var(--mute)}
#layers{position:absolute;left:8px;top:28px;max-height:70%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 8px;display:none;z-index:3;font-size:12px}
#layers label{display:block;white-space:nowrap}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mute);text-align:center;padding:20px;z-index:4;pointer-events:none}
#drop{position:fixed;inset:0;background:rgba(232,89,12,.15);border:3px dashed var(--acc);display:none;z-index:9}
</style>
</head>
<body>
<header>
  <b>Plan Viewer</b><span id="name">no design</span><span class="sp"></span>
  <select id="level" title="Level shown in 2D"></select>
  <label class="btn" title="3D shows all levels"><input type="checkbox" id="allLv" checked> all levels in 3D</label>
  <label class="btn" title="Show false ceilings in 3D"><input type="checkbox" id="ceil"> ceilings</label>
  <button id="bLayers">Layers</button>
  <button data-v="json">JSON</button><button data-v="d2">2D</button><button data-v="d3">3D</button><button data-v="all">All</button>
  <label class="btn">Open…<input type="file" id="file" accept=".json" hidden></label>
</header>
<main id="main" class="all">
  <section class="pane" id="pJson"><div class="ptitle">JSON</div><div id="json"></div></section>
  <section class="pane" id="pD2"><div class="ptitle">2D</div><canvas id="c2"></canvas><div id="layers"></div><div id="info"></div></section>
  <section class="pane" id="pD3"><div class="ptitle">3D</div><div id="c3" style="width:100%;height:100%"></div></section>
</main>
<div id="msg">Open with <code>?src=Designs/Name.json</code>, or drop a JSON file here.</div>
<div id="drop"></div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const $ = (s) => document.querySelector(s);
const store = { get(k){ try { return localStorage.getItem(k); } catch { return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch {} } };

/* ---------------- loading ---------------- */
// The viewer lives at library/Viewer/v1/ — relative `src` paths resolve against library/.
const LIB = new URL("../../", location.href);
function resolveSrc(s) {
  if (/^https?:/i.test(s)) return s;
  return new URL(s.replace(/^\/+/, "").split("/").map(encodeURIComponent).join("/"), LIB).href;
}
async function loadUrl(src) {
  msg(`Loading ${src} …`);
  try {
    const r = await fetch(resolveSrc(src), { cache: "no-cache" });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    setDoc(await r.json(), src.split("/").pop());
    loadBake(src.replace(/\.json$/i, ".view.json"));
  } catch (e) { msg(`Could not load ${src}: ${e.message}`); }
}
// Baked object shapes (tools/viewer/bake.mjs). Absent → objects stay boxes.
let bake = null;
async function loadBake(src) {
  try {
    const r = await fetch(resolveSrc(src), { cache: "no-cache" });
    if (!r.ok) return;
    bake = await r.json(); attachBake(); build3D(); draw2D();
    $("#name").textContent += ` · ${Object.keys(bake.items).length} baked`;
  } catch {}
}
function attachBake() {
  for (const e of els) {
    e.bake = null; e.spaceBakes = null;
    if (!bake) continue;
    if (e.kind === "object") e.bake = bake.items[`${e.li}/${e.id}`] || null;
    else if (e.kind === "door" || e.kind === "window") {
      const a = (e.raw.attachments || []).find(t => !/^wall/.test(t.objectId || "") && bake.items[`${e.li}/${t.id}`]);
      e.bake = a ? bake.items[`${e.li}/${a.id}`] : null;
    } else if (e.kind === "space") {
      e.spaceBakes = (e.raw.attachments || []).filter(t => bake.items[`${e.li}/${t.id}`])
        .map(t => ({ item: bake.items[`${e.li}/${t.id}`], ceiling: /ceiling/.test(t.objectId || "") }));
    }
  }
}
function msg(t) { $("#msg").style.display = t ? "flex" : "none"; $("#msg").textContent = t || ""; }

/* ---------------- model ---------------- */
// Object defaults when a placement carries no size: [x, y, height, z] in metres.
const DEF = {
  bed:[2,1.6,.55], sofa:[2,.9,.85], chair:[.5,.5,.85], armchair:[.8,.8,.85], table:[1.2,.8,.75],
  nightstand:[.45,.4,.55], wardrobe:[1.8,.6,2.1], cabinet:[.6,.6,.9], "kitchen-sink":[.8,.5,.9],
  stove:[.6,.5,.9], refrigerator:[.7,.7,1.8], toilet:[.6,.4,.75], washbasin:[.55,.45,.85],
  "tv-unit":[1.6,.4,.5], "plant-potted":[.4,.4,1], downlight:[.1,.1,.04], chandelier:[.6,.6,.6],
  pendant:[.3,.3,.4], curtain:[1.5,.1,2.6], "switch-plate":[.1,.02,.1,1.2], "socket-outlet":[.08,.02,.08,.3],
  "floor-drain":[.12,.12,.01], camera:[.15,.15,.15,2.6], "exhaust-fan":[.3,.3,.3,2.4],
  "split-ac-indoor":[.9,.25,.3,2.3], "split-ac-outdoor":[.8,.3,.6], "distribution-board":[.4,.12,.5,1.5],
  tank:[1.2,1.2,1.2], footing:[1.2,1.2,.5], column:[.3,.3,3],
};
const COL = { wall:0xd8d4cc, glass:0x9cc7e8, column:0x9ca3af, footing:0x92400e, light:0xfde68a,
  soft:0xb79f8a, wood:0x9a7b5c, white:0xeef0f2, mep:0x60a5fa, other:0xa3a3a3, sel:0xe8590c };
const CAT = (id) =>
  /column|beam/.test(id) ? "column" : /footing/.test(id) ? "footing" :
  /light|chandelier|pendant/.test(id) ? "light" : /sofa|chair|armchair|bed|curtain/.test(id) ? "soft" :
  /table|wardrobe|cabinet|nightstand|tv-unit/.test(id) ? "wood" :
  /toilet|basin|sink|fridge|refrigerator|stove/.test(id) ? "white" :
  /switch|socket|drain|ac-|fan|board|camera|tank|pipe|conduit/.test(id) ? "mep" : "other";

let doc = null, levels = [], els = [], byPath = new Map(), sel = null, ppm = 100;
let curLevel = 0, hiddenLayers = new Set();

const short = (oid) => (oid || "").replace(/-with-math$/, "");
const num = (v) => (typeof v === "number" && isFinite(v) ? v : undefined);

function sizeOf(oid, p) {
  const d = DEF[short(oid)] || [.4,.4,.4];
  let x = num(p.length) ?? num(p.width) ?? num(p.diameter) ?? num(p.tankDiameter) ?? num(p.baseWidth);
  let y = num(p.length) != null ? (num(p.width) ?? num(p.depth) ?? num(p.breadth))
        : (num(p.depth) ?? num(p.breadth) ?? num(p.baseDepth) ?? (num(p.width) != null ? undefined : num(p.diameter)));
  let h = num(p.height) ?? num(p.columnHeight);
  x ??= d[0]; y ??= d[1]; h ??= d[2];
  let z = num(p.base) ?? 0;
  if (num(p.mountHeight) != null) z = p.mountHeight - h; else if (d[3] != null) z = d[3];
  return { x, y, h, z };
}

/* Grouped documents (schemaVersion 3, docs/canvas-groups-schema.md): every group's canvas is placed on the
   site — site_px = position·s + R(rotation)·M(mirror)·p·(s/c), mirror then rotate then scale then move; a
   child's transform is relative to its parent's canvas. Canvas levels land on site levels via levelMap.
   Ids are prefixed with the group id (the five Villa-1 plots share every id); each entity keeps `_p`, its
   path in the original file, so the JSON pane still points at the real thing. */
function flattenGroups(d) {
  const s = d.settings?.pixelsPerMeter || 100;
  const site = (d.levels || []).map(L => ({ id: L.id, name: L.name, elevation: L.elevation || 0, height: L.height || 3, nodes: [], segments: [], spaces: [] }));
  const byLevel = new Map(site.map(L => [L.id, L]));
  const ground = site.find(L => (L.elevation || 0) === 0) || site[0];
  const byId = new Map(d.groups.map(g => [g.id, g]));
  // A transform as { m: 2×2 matrix (includes mirror + rotation), t: offset } in SITE px, from canvas px.
  const xf = (g) => {
    const c = g.canvas?.settings?.pixelsPerMeter || s, T = g.transform || {}, r = (T.rotation || 0) * Math.PI / 180;
    const k = (g.parent && byId.get(g.parent)?.canvas?.settings?.pixelsPerMeter || s) / c;
    const cos = Math.cos(r) * k, sin = Math.sin(r) * k, mx = T.mirror ? -1 : 1;
    const own = { m: [cos * mx, -sin, sin * mx, cos], t: [(T.position?.[0] || 0) * (g.parent ? (byId.get(g.parent)?.canvas?.settings?.pixelsPerMeter || s) : s), (T.position?.[1] || 0) * (g.parent ? (byId.get(g.parent)?.canvas?.settings?.pixelsPerMeter || s) : s)],
      rot: T.rotation || 0, mirror: !!T.mirror };
    const par = g.parent && byId.get(g.parent);
    if (!par) return own;
    const P = xf(par);
    const [a, b, c2, e] = P.m, [p, q, r2, t] = own.m;
    return { m: [a * p + b * r2, a * q + b * t, c2 * p + e * r2, c2 * q + e * t],
      t: [a * own.t[0] + b * own.t[1] + P.t[0], c2 * own.t[0] + e * own.t[1] + P.t[1]],
      rot: P.rot + (P.mirror ? -own.rot : own.rot), mirror: own.mirror !== P.mirror };
  };
  d.groups.forEach((g, gi) => {
    if (g.visible === false || !g.canvas) return;
    const X = xf(g), pre = g.id + "/";
    const pt = (n) => ({ x: X.m[0] * n.x + X.m[1] * n.y + X.t[0], y: X.m[2] * n.x + X.m[3] * n.y + X.t[1] });
    const turn = (a) => { const p = a.params; if (!p || typeof p.rotation !== "number") return a;
      const r = (X.mirror ? 180 - p.rotation : p.rotation) + X.rot; return { ...a, params: { ...p, rotation: ((r % 360) + 360) % 360 } }; };
    const c = g.canvas;
    const lv = c.levels?.length ? c.levels.map((L, i) => ({ L, p: ["groups", gi, "canvas", "levels", i] }))
      : [{ L: { id: "", nodes: c.nodes, segments: c.segments, spaces: c.spaces }, p: ["groups", gi, "canvas"] }];
    for (const { L, p } of lv) {
      const target = g.levelMap ? byLevel.get(g.levelMap[L.id] ?? g.levelMap[""]) : ground;
      if (!target) continue;
      (L.nodes || []).forEach((n, i) => target.nodes.push({ ...n, ...pt(n), id: pre + n.id, _p: [...p, "nodes", i],
        attachments: (n.attachments || []).map(a => turn({ ...a, id: pre + a.id })) }));
      (L.segments || []).forEach((sg, i) => target.segments.push({ ...sg, id: pre + sg.id, fromNodeId: pre + sg.fromNodeId, toNodeId: pre + sg.toNodeId, _p: [...p, "segments", i],
        attachments: (sg.attachments || []).map(a => ({ ...a, id: pre + a.id })) }));
      (L.spaces || []).forEach((sp, i) => target.spaces.push({ ...sp, id: pre + sp.id, nodeIds: (sp.nodeIds || []).map(id => pre + id), _p: [...p, "spaces", i] }));
    }
  });
  return site;
}

function setDoc(d, name) {
  doc = d; sel = null; bake = null;
  ppm = d.settings?.pixelsPerMeter || 100;
  const rootHas = (d.nodes?.length || d.segments?.length);
  levels = d.groups?.length ? flattenGroups(d) : d.levels?.length ? d.levels.map((L, i) => {
    // The live level is sometimes held at the root; use it when the level copy is empty.
    if (rootHas && L.id === d.activeLevelId && !L.nodes?.length) return { ...L, nodes: d.nodes, segments: d.segments, spaces: d.spaces, _root: true };
    return L;
  }) : [{ id: "L", name: "Plan", elevation: 0, height: 3, nodes: d.nodes || [], segments: d.segments || [], spaces: d.spaces || [], _root: true }];
  buildEls();
  $("#name").textContent = name || "design";
  $("#level").innerHTML = levels.map((L, i) => `<option value="${i}">${esc(L.name || "Level " + (i+1))}</option>`).join("");
  curLevel = Math.max(0, levels.findIndex(L => L.id === d.activeLevelId));
  $("#level").value = curLevel;
  hiddenLayers = new Set((d.layers || []).filter(l => l.visible === false).map(l => l.id));
  buildLayers(); renderTree(); build3D.fitted = false; build3D(); fit2D(); draw2D(); msg("");
}

function buildEls() {
  els = []; byPath = new Map();
  levels.forEach((L, li) => {
    const base = L._root ? [] : ["levels", li];
    const nm = new Map((L.nodes || []).map(n => [n.id, n]));
    const elev = L.elevation || 0, lh = L.height || 3;
    const add = (e) => { e.li = li; els.push(e); byPath.set(e.path.join("."), e); };
    (L.spaces || []).forEach((s, i) => {
      const poly = (s.nodeIds || []).map(id => nm.get(id)).filter(Boolean).map(n => [n.x / ppm, n.y / ppm]);
      if (poly.length >= 3) add({ kind: "space", id: s.id, layer: s.layer, label: s.label, raw: s, path: s._p || [...base, "spaces", i], poly, elev });
    });
    (L.segments || []).forEach((s, i) => {
      const a = nm.get(s.fromNodeId), b = nm.get(s.toNodeId);
      if (!a || !b || a === b) return;
      const att = s.attachments || [];
      const find = (re) => att.find(t => re.test(t.objectId || ""));
      const wall = find(/^wall/), door = find(/^door/), win = find(/^window/);
      const isWall = !!wall || (s.segmentType === "wall");
      const kind = door ? "door" : win ? "window" : isWall ? "wall" : "line";
      const t = num(wall?.params?.thickness) ?? (s.thickness || 1) / ppm;
      const other = att.find(t => !/^(wall|door|window)/.test(t.objectId || ""));
      add({ kind, id: s.id, layer: s.layer, label: s.label || short(other?.objectId), raw: s, path: s._p || [...base, "segments", i],
        a: [a.x / ppm, a.y / ppm], b: [b.x / ppm, b.y / ppm], t, color: s.color, dashed: s.dashed,
        h: num(wall?.params?.height) ?? lh, open: (door || win)?.params || {}, objectId: other?.objectId, elev, att: door || win, nodes: [a, b] });
    });
    (L.nodes || []).forEach((n, i) => (n.attachments || []).forEach((t, j) => {
      const p = t.params || {}, s = sizeOf(t.objectId, p);
      add({ kind: "object", id: t.id, layer: n.layer, label: short(t.objectId), objectId: t.objectId, raw: t,
        path: n._p ? [...n._p, "attachments", j] : [...base, "nodes", i, "attachments", j], x: n.x / ppm, y: n.y / ppm, rot: (num(p.rotation) || 0) * Math.PI / 180,
        sx: s.x, sy: s.y, h: s.h, z: s.z, cat: CAT(short(t.objectId)), elev, att: t, node: n });
    }));
  });
}
const visible = (e) => !hiddenLayers.has(e.layer);

/* ---------------- layers ---------------- */
function buildLayers() {
  const used = new Set(els.map(e => e.layer));
  const list = (doc.layers || []).filter(l => used.has(l.id));
  for (const id of used) if (id != null && !list.some(l => l.id === id)) list.push({ id, name: id });
  $("#layers").innerHTML = list.map(l => `<label><input type="checkbox" data-l="${esc(l.id)}" ${hiddenLayers.has(l.id) ? "" : "checked"}> ${esc(l.name || l.id)}</label>`).join("") || "<i>no layers</i>";
}
$("#layers").addEventListener("change", (ev) => {
  const id = ev.target.dataset.l; ev.target.checked ? hiddenLayers.delete(id) : hiddenLayers.add(id);
  build3D(); draw2D();
});
$("#bLayers").onclick = () => { const s = $("#layers").style; s.display = s.display === "block" ? "none" : "block"; $("#bLayers").classList.toggle("on"); };

/* ---------------- selection ---------------- */
function select(e, from) {
  sel = e || null;
  if (from !== "tree") revealTree(sel?.path);
  paint3DSelection();
  draw2D(); showInfo();
  if (sel && from !== "2d" && sel.li !== curLevel) { curLevel = sel.li; $("#level").value = curLevel; fit2D(); draw2D(); }
}
function showInfo() {
  const box = $("#info");
  if (!sel) { box.style.display = "none"; return; }
  const rows = [["kind", sel.kind], ["id", sel.id], ["label", sel.label], ["object", sel.objectId], ["layer", sel.layer], ["level", levels[sel.li]?.name]];
  const att = sel.att, p = att?.params || sel.raw?.attachments?.[0]?.params;
  const editable = !!att?.objectPath;
  let form = "";
  if (p) for (const [k, v] of Object.entries(p)) {
    if (typeof v === "object" || k === "renderMode" || String(v).length >= 60) continue;
    if (!editable) { rows.push([k, v]); continue; }
    const input = typeof v === "boolean" ? `<input type="checkbox" data-k="${esc(k)}" ${v ? "checked" : ""}>`
      : typeof v === "number" ? `<input type="number" step="any" data-k="${esc(k)}" value="${v}" style="width:9ch">`
      : `<input data-k="${esc(k)}" value="${esc(v)}" style="width:14ch">`;
    form += `<tr><td>${esc(k)}</td><td>${input}</td></tr>`;
  }
  box.innerHTML = "<table>" + rows.filter(r => r[1] != null && r[1] !== "").map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(String(v))}</td></tr>`).join("") + form + "</table>"
    + (editable ? `<div id="evalStatus" style="color:var(--mute);margin-top:4px">${esc(sel._status || "Edit a value to re-evaluate (preview, not saved)")}</div>` : "");
  box.style.display = "block";
  if (editable) box.querySelectorAll("[data-k]").forEach(inp => inp.addEventListener("change", () => {
    const k = inp.dataset.k, old = att.params[k];
    att.params[k] = typeof old === "boolean" ? inp.checked : typeof old === "number" ? (isFinite(+inp.value) ? +inp.value : old) : inp.value;
    reevaluate(sel);
  }));
}

/* ---------------- live objects (Phase 3) ---------------- */
// objects.js is the app's own evaluator bundled for the browser (tools/viewer/runtime). It runs in a module
// Worker so a heavy object (a lofted bed: ~12 s) never freezes the page.
const RUNTIME = new URL("objects.js", location.href).href;
let worker = null, reqId = 0; const pending = new Map();
function getWorker() {
  if (worker) return worker;
  const code = `import { evaluate } from ${JSON.stringify(RUNTIME)};
const defs = {};
onmessage = async (ev) => {
  const { id, plan, lib, paths } = ev.data;
  try {
    for (const p of paths) if (!defs[p]) {
      const r = await fetch(lib + "/" + p.split("/").map(encodeURIComponent).join("/"), { cache: "no-cache" });
      if (!r.ok) throw new Error(p + " -> " + r.status);
      defs[p] = await r.json();
    }
    const t = performance.now(); const out = evaluate(plan, defs);
    postMessage({ id, out, ms: performance.now() - t });
  } catch (e) { postMessage({ id, error: String(e && e.message || e) }); }
};`;
  worker = new Worker(URL.createObjectURL(new Blob([code], { type: "text/javascript" })), { type: "module" });
  worker.onmessage = (ev) => { const f = pending.get(ev.data.id); if (f) { pending.delete(ev.data.id); f(ev.data); } };
  worker.onerror = (ev) => { for (const f of pending.values()) f({ error: ev.message || "worker failed to load" }); pending.clear(); };
  return worker;
}
const libBase = () => String(doc.settings?.library_path || LIB.href).replace(/\/+$/, "");
const HELPER_MESH = /view cone|beam \/ aim|footprint/i;
function setStatus(e, t) { e._status = t; if (sel === e) { const s = $("#evalStatus"); if (s) s.textContent = t; } }
async function reevaluate(e) {
  const full = (a) => ({ ...a, params: { ...a.params, renderMode: "Full" } });

  requestAnimationFrame(() => { resize(); if (doc) { fit2D(); draw2D(); } });
}
document.querySelectorAll("header [data-v]").forEach(b => b.onclick = () => setView(b.dataset.v));
$("#level").onchange = () => { curLevel = +$("#level").value; fit2D(); draw2D(); if (!$("#allLv").checked) build3D(); };
$("#allLv").onchange = () => build3D();
$("#ceil").onchange = () => build3D();
const readFile = (f) => f && f.text().then(t => setDoc(JSON.parse(t), f.name)).catch(e => msg("Not a valid JSON file: " + e.message));
$("#file").onchange = (e) => readFile(e.target.files[0]);
addEventListener("dragover", (e) => { e.preventDefault(); $("#drop").style.display = "block"; });
addEventListener("dragleave", (e) => { if (!e.relatedTarget) $("#drop").style.display = "none"; });
addEventListener("drop", (e) => { e.preventDefault(); $("#drop").style.display = "none"; readFile(e.dataTransfer.files[0]); });
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

setView(new URLSearchParams(location.search).get("view") || store.get("pv.view") || "all");
const src = new URLSearchParams(location.search).get("src");
if (src) loadUrl(src); else showIndex();

// No ?src= → list the library's designs (designs.json, refreshed by publish.mjs / bake.mjs).
async function showIndex() {
  try {
    const r = await fetch(new URL("designs.json", location.href), { cache: "no-cache" });
    if (!r.ok) return;
    const { designs } = await r.json();
    const box = $("#msg");
    box.style.pointerEvents = "auto"; box.style.alignItems = "flex-start"; box.style.overflow = "auto"; box.style.top = "41px";
    box.innerHTML = `<div style="text-align:left;max-width:640px;width:100%"><h3 style="margin:8px 0">Designs</h3>
      <input id="q" placeholder="filter…" style="width:100%;padding:6px 8px;margin-bottom:8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)">
      <div id="dl"></div><p style="font-size:12px">● = real object shapes baked · ○ = boxes only</p></div>`;
    const draw = (q) => $("#dl").innerHTML = designs.filter(d => d.name.toLowerCase().includes(q)).map(d =>
      `<div style="padding:3px 0"><a style="color:var(--ink)" href="?src=${encodeURIComponent(d.path)}">${d.baked ? "●" : "○"} ${esc(d.name)}</a>
       <span style="color:var(--mute);font-size:12px">${(d.size / 1048576).toFixed(1)} MB</span></div>`).join("");
    draw(""); $("#q").oninput = (e) => draw(e.target.value.toLowerCase());
  } catch {}
}
</script>
</body>
</html>
