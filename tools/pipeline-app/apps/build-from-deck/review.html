<style>
/* Layout: an interiors shop. Store bar (room, search, selection), trade rail, product grid; a product page per item
   (gallery | summary + Customise / Product / Specifications tabs); plan popup for "Where it goes";
   checkout = sign-off. Phones: compact bar, sticky bottom sign-off bar, full-screen product page. */
:root {
  --bg: #f6f6f4;
  --card: #ffffff;
  --ink: #171a19;
  --muted: #646e69;
  --line: #e3e5e1;
  --line-2: #cdd1cc;
  --tile: #ecedea;
  --accent: #1f4d43;
  --accent-ink: #ffffff;
  --accent-soft: #e3eeea;
  --approve: #24734a; --approve-bg: #e3f1e8;
  --change: #9c5b0e; --change-bg: #f7ecdc;
  --question: #5545a8; --question-bg: #ebe9f8;
  --omit: #6f7571; --omit-bg: #ecedeb;
  --zone: rgba(31, 77, 67, 0.40); --zone-line: #1f4d43; --zone-other: rgba(100, 110, 105, 0.12);
  --shadow: 0 1px 2px rgba(23, 26, 25, .05), 0 8px 24px rgba(23, 26, 25, .06);
  --shadow-up: 0 12px 34px rgba(23, 26, 25, .14);
  --f-display: "Bricolage Grotesque", "Schibsted Grotesk", system-ui, sans-serif;
  --f-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111413; --card: #1a1e1c; --ink: #e8ece9; --muted: #9aa49f; --line: #2a302d; --line-2: #3b4440; --tile: #232826;
    --accent: #86c7b3; --accent-ink: #0d1412; --accent-soft: #1d2f2a;
    --approve: #72cf95; --approve-bg: #1b3125; --change: #e6a858; --change-bg: #382a16; --question: #ab9ff2; --question-bg: #262340;
    --omit: #959b97; --omit-bg: #252a28; --zone: rgba(134, 199, 179, .40); --zone-line: #86c7b3; --zone-other: rgba(154, 164, 159, .14);
    --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-up: 0 12px 34px rgba(0,0,0,.5); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111413; --card: #1a1e1c; --ink: #e8ece9; --muted: #9aa49f; --line: #2a302d; --line-2: #3b4440; --tile: #232826;
  --accent: #86c7b3; --accent-ink: #0d1412; --accent-soft: #1d2f2a;
  --approve: #72cf95; --approve-bg: #1b3125; --change: #e6a858; --change-bg: #382a16; --question: #ab9ff2; --question-bg: #262340;
  --omit: #959b97; --omit-bg: #252a28; --zone: rgba(134, 199, 179, .40); --zone-line: #86c7b3; --zone-other: rgba(154, 164, 159, .14);
  --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-up: 0 12px 34px rgba(0,0,0,.5); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; }
.gut { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.btn { border: 1px solid var(--line-2); background: var(--card); border-radius: 999px; padding: 8px 16px; cursor: pointer; font-weight: 500; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 5px 12px; font-size: 13.5px; }
.btn.link { border: 0; background: none; padding: 4px 2px; text-decoration: underline; text-underline-offset: 3px; }
.btn.icon { width: 36px; height: 36px; padding: 0; border-radius: 50%; }
.btn svg, .chipbtn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.pill[data-s="approve"] { background: var(--approve-bg); color: var(--approve); }
.pill[data-s="changed"] { background: var(--change-bg); color: var(--change); }
.pill[data-s="question"] { background: var(--question-bg); color: var(--question); }
.pill[data-s="omit"] { background: var(--omit-bg); color: var(--omit); }
.pill[data-s="pending"] { background: var(--tile); color: var(--muted); }
.pill.new { background: var(--ink); color: var(--bg); }

/* store bar: two rows. Row 1 = room, search, progress (opens the selection), one next-step button. Row 2 = trade tabs + filter. */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--card); border-bottom: 1px solid var(--line); }
.bar .top { display: flex; align-items: center; gap: 14px; padding-block: 10px; }
.brand { display: grid; line-height: 1.15; min-width: 0; flex: 0 1 auto; margin-right: 6px; }
.brand h1 { font-size: 21px; font-weight: 700; letter-spacing: -.01em; white-space: nowrap; }
.brand span { font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search { flex: 0 1 280px; position: relative; }
.search input { width: 100%; border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px 8px 36px; background: var(--bg); }
.search input:focus { border-color: var(--line-2); background: var(--card); }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2.2; }
.sbtn { display: none; }
.prog { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 4px 8px 4px 4px; border-radius: 999px; cursor: pointer; font-size: 13.5px; color: var(--muted); white-space: nowrap; }
.prog:hover { background: var(--bg); }
.prog b { color: var(--ink); font-variant-numeric: tabular-nums; font-weight: 600; }
.prog svg { width: 26px; height: 26px; transform: rotate(-90deg); flex: none; }
.prog circle { fill: none; stroke-width: 4; }
.prog .trk { stroke: var(--line); }
.prog .val { stroke: var(--accent); stroke-linecap: round; stroke-dasharray: 94.25; stroke-dashoffset: 94.25; transition: stroke-dashoffset .3s ease; }
.tabrow .gut { display: flex; align-items: center; gap: 12px; }
.ttabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 28px), transparent); }
.ttabs::-webkit-scrollbar { display: none; }
.trade { border: 0; background: none; padding: 10px 10px 11px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; color: var(--muted); font-weight: 500; font-size: 14px; border-bottom: 2px solid transparent; }
.trade:hover { color: var(--ink); }
.trade[aria-pressed="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.trade .c { font-size: 11.5px; font-variant-numeric: tabular-nums; background: var(--tile); color: var(--muted); border-radius: 999px; padding: 0 6px; line-height: 18px; min-width: 18px; text-align: center; }
.trade.done .c { background: var(--approve-bg); color: var(--approve); }
.trade:disabled { display: none; }
.filter { position: relative; display: inline-flex; align-items: center; flex: none; }
.filter svg { position: absolute; left: 10px; width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2.2; pointer-events: none; }
.filter select { appearance: none; -webkit-appearance: none; border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px 5px 30px; background: var(--card); font-size: 13.5px; cursor: pointer; }
.filter select.on { border-color: var(--ink); font-weight: 500; }
.mbar { display: none; }
.lay { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; flex: none; }
.lay button { border: 0; background: none; width: 30px; height: 26px; border-radius: 999px; display: grid; place-items: center; cursor: pointer; color: var(--muted); }
.lay button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.lay svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; }
.llist { display: grid; gap: 18px; padding-bottom: 60px; }
.lgroup { display: grid; gap: 8px; }
.lgh { padding: 2px 2px 0; }
.lrow { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: start; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
.lth { border: 0; padding: 0; background: none; cursor: pointer; }
.lth .th { width: 64px; height: 64px; border-radius: 10px; overflow: hidden; background: var(--tile); }
.lth .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.lth .th .tile { padding: 4px; } .lth .th .tile .initial { font-size: 24px; } .lth .th .tile .stripe { inset: 12%; }
.lmain { display: grid; gap: 5px; min-width: 0; }
.ltop { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
.lname { all: unset; cursor: pointer; font: 600 16px/1.25 var(--f-display); }
.lname:focus-visible { outline: 2px solid var(--accent); }
.lcode { font-size: 12.5px; color: var(--muted); }
.lmeta { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; font-size: 13px; color: var(--muted); }
.lmeta > span:not(.dots) + span:not(.dots)::before { content: "· "; }
.chg { margin: 2px 0 0; padding: 0; list-style: none; display: grid; gap: 2px; font-size: 13px; }
.chg li { overflow-wrap: anywhere; } .chg .k { color: var(--muted); } .chg .v { font-family: var(--f-mono); font-size: 12px; }
.chg i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--line-2); vertical-align: -1px; margin-right: 3px; }
.lrow .cm { font-size: 13px; background: var(--bg); border-radius: 8px; padding: 5px 9px; justify-self: start; }
.lend { display: grid; gap: 8px; justify-items: end; align-self: center; }
.lact { display: flex; gap: 6px; }
dialog.sheet { margin: 0 0 0 auto; height: 100%; max-height: 100%; width: min(420px, 100vw); border: 0; padding: 0; background: var(--bg); color: var(--ink); box-shadow: var(--shadow-up); }
dialog.sheet[open] { display: flex; flex-direction: column; }
dialog.sheet::backdrop { background: rgba(12, 15, 14, .45); }
.sheet-top { display: flex; align-items: center; justify-content: space-between; padding: 14px 14px 12px 22px; padding-top: calc(14px + env(safe-area-inset-top, 0px)); border-bottom: 1px solid var(--line); background: var(--card); }
.sheet-top h2 { font-size: 19px; font-weight: 600; }
dialog.sheet { background: var(--card); }
dialog.sheet .summary { position: static; margin: 0; overflow: auto; box-shadow: none; border: 0; border-radius: 0; padding: 18px 22px 24px; align-content: start; }
.sobar { display: grid; gap: 6px; }
.sobar .t { display: flex; justify-content: space-between; font-size: 13.5px; color: var(--muted); }
.sobar .t b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.sobar .track { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--tile); }
.sobar .track i { display: block; height: 100%; transition: width .3s ease; }
.summary .info { font-size: 13px; background: var(--tile); color: var(--ink); border-radius: 8px; padding: 9px 11px; }
.stages { display: inline-flex; border: 1px solid var(--line-2); border-radius: 999px; padding: 3px; gap: 2px; flex: none; margin-right: auto; background: var(--card); }
.stg { border: 0; background: none; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-weight: 500; font-size: 13.5px; color: var(--muted); display: inline-flex; gap: 7px; align-items: center; justify-content: center; white-space: nowrap; transition: background .18s, color .18s; }
.stg:hover { color: var(--ink); background: var(--bg); }
.stg[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.sbadge { font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 18px; height: 18px; line-height: 18px; padding: 0 5px; border-radius: 999px; text-align: center; background: var(--tile); color: var(--muted); }
.stg[aria-pressed="true"] .sbadge { background: color-mix(in srgb, var(--card) 22%, transparent); color: var(--card); }
.sbadge[data-k="done"] { background: var(--approve-bg); color: var(--approve); }
.sbadge[data-k="review"] { background: var(--accent); color: #fff; }
.sbadge[data-k="busy"] { background: var(--change-bg); color: var(--change); position: relative; }
.sbadge[data-k="busy"]::after { content: ""; position: absolute; top: -2px; right: -2px; width: 7px; height: 7px; border-radius: 50%; background: var(--change); animation: pulse 1.2s ease-in-out infinite; }
.sdot { width: 7px; height: 7px; border-radius: 50%; background: var(--change); }
.cp { padding-block: 20px 80px; display: grid; gap: 14px; }
.cstatus { font-size: 12px; font-weight: 600; padding: 4px 12px; border-radius: 999px; background: var(--change-bg); color: var(--change); white-space: nowrap; }
.cstatus[data-ok="true"] { background: var(--approve-bg); color: var(--approve); }
.cbanner { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; background: var(--change-bg); border-radius: 12px; padding: 12px 14px; }
.cbanner > div { flex: 1 1 320px; min-width: 0; }
.ctiles .fstep[data-k="ok"] b { color: var(--approve); }
.ctiles .fstep[data-k="stale"] b { color: var(--change); }
.ctiles .fstep[data-k="miss"] b { color: #b3412e; }
.cgrid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(300px, 1fr); gap: 18px; align-items: start; }
.cplanbox { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: grid; gap: 10px; min-width: 0; }
.clyr { position: relative; margin-left: auto; }
.clyr summary { list-style: none; display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: 13.5px; font-weight: 500; background: var(--card); user-select: none; }
.clyr summary::-webkit-details-marker { display: none; }
.clyr summary svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.clyr[open] summary { border-color: var(--ink); }
.clyr .clayers { position: absolute; right: 0; top: calc(100% + 6px); z-index: 6; display: grid; gap: 2px; min-width: 210px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px; box-shadow: var(--shadow-up); animation: pop .14s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(-4px); } }
.lyr { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; }
.lyr:hover { background: var(--bg); }
.lyr input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.withpill { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.withpill .cstatus { font-family: var(--f-body, inherit); }
.cplanwrap { background: var(--bg); border-radius: 12px; overflow: hidden; }
.cplanhead { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.seg.cmode { display: inline-flex; background: var(--tile); border-radius: 999px; padding: 3px; flex: none; }
.seg.cmode button { border: 0; background: none; font: inherit; font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 999px; color: var(--muted); cursor: pointer; min-height: 32px; }
.seg.cmode button[aria-selected="true"] { background: var(--ink); color: var(--card); }
.c3d { position: relative; height: clamp(340px, 60vh, 640px); }
.c3stage { position: absolute; inset: 0; }
.c3stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
.c3tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; }
.c3btn { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.c3btn[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.c3btn:disabled { opacity: .5; }
.c3hint { position: absolute; left: 10px; bottom: 10px; font-size: 12px; color: var(--muted); background: color-mix(in srgb, var(--card) 85%, transparent); padding: 4px 8px; border-radius: 8px; pointer-events: none; }
.c3tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--card); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.c3msg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; color: var(--muted); font-size: 14px; }
.c3msg[hidden], .c3tip[hidden] { display: none; }
@media (max-width: 640px) { .c3d { height: auto; aspect-ratio: 1 / 1.05; } .c3hint { display: none; } .c3tools { top: 8px; right: 8px; } }
.cplan { display: block; width: 100%; height: auto; max-height: 64vh; }
.cfloor { opacity: .85; stroke: rgba(0,0,0,.18); stroke-width: .6; transition: opacity .15s; }
.cceil { fill: none; stroke-width: 1.4; stroke-dasharray: 4 3; }
.cwall { stroke: #2b302d; stroke-width: 2.8; stroke-linecap: square; }
.cglass { stroke: #6aa2c6; stroke-width: 1.6; }
.cdoor { stroke: #8c938f; stroke-width: 1.2; stroke-dasharray: 2 2; }
.ccol { fill: #2b302d; }
.cobj { stroke: rgba(20,24,22,.55); stroke-width: .6; cursor: pointer; transition: opacity .15s; }
.cobj.cface { stroke-width: 3.2; stroke-linecap: butt; fill: none; }
.cobj.lighting { stroke: #8a6a2a; stroke-width: .9; }
.cobj:hover { stroke: var(--accent); stroke-width: 1.4; }
.cobj.cface:hover { stroke-width: 4.5; }
.dim { opacity: .22; }
.ccam polygon { fill: var(--accent); opacity: .14; }
.ccam circle { fill: var(--accent); }
.ccam text { font: 600 5.5px var(--f-body); fill: var(--accent); }
.ccam { cursor: pointer; }
.ccam.on polygon { opacity: .35; }
.csel { font: 700 6px var(--f-mono); fill: var(--ink); paint-order: stroke; stroke: var(--card); stroke-width: 2px; }
.cstrip { display: grid; gap: 6px; }
.cthumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.cthumb { flex: none; width: 128px; border: 2px solid transparent; border-radius: 10px; padding: 0; background: var(--tile); cursor: pointer; overflow: hidden; position: relative; }
.cthumb img { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; }
.cthumb span { position: absolute; left: 6px; bottom: 5px; font: 600 11px var(--f-mono); background: var(--card); color: var(--ink); padding: 1px 6px; border-radius: 4px; }
.cthumb.on { border-color: var(--accent); }
.cside { display: grid; gap: 12px; min-width: 0; position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); max-height: calc(100vh - 96px); overflow: auto; }
.cdet { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 10px; }
.cdet.hint { display: grid; gap: 4px; background: var(--bg); border-style: dashed; }
.cbig { width: 100%; border-radius: 10px; display: block; }
.cpill { justify-self: start; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; background: var(--tile); color: var(--muted); }
.cpill[data-k="ok"] { background: var(--approve-bg); color: var(--approve); }
.cpill[data-k="stale"], .cpill[data-k="wait"] { background: var(--change-bg); color: var(--change); }
.cpill[data-k="miss"] { background: #f6e1dc; color: #b3412e; }
.cch { margin: 0; padding-left: 18px; font-size: 13.5px; display: grid; gap: 3px; }
.clist { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 6px; }
.cgroup { display: grid; gap: 2px; }
.cgh { font-size: 12px; color: var(--muted); padding: 6px 4px 2px; }
.crow { all: unset; box-sizing: border-box; display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 7px 8px; border-radius: 9px; cursor: pointer; }
.crow:hover, .crow.hov { background: var(--bg); }
.crow.sel { background: var(--accent-soft); }
.crow:focus-visible { outline: 2px solid var(--accent); }
.cdot { width: 9px; height: 9px; border-radius: 50%; background: var(--approve); }
.cdot[data-k="stale"], .cdot[data-k="wait"] { background: var(--change); }
.cdot[data-k="miss"] { background: #b3412e; }
.cdot[data-k="out"] { background: var(--line-2); }
.cn { display: grid; min-width: 0; }
.cn b { font-weight: 600; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cn small { color: var(--muted); font-size: 12px; }
.cs { font-size: 12px; color: var(--muted); text-align: right; max-width: 150px; }
.cgate { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.cgate.ok { background: var(--approve-bg); border-color: transparent; color: var(--approve); }
.cgate textarea { width: 100%; border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 11px; background: var(--card); resize: vertical; }
.cgate .btn { justify-self: start; }
.saved { font-size: 11.5px; color: var(--approve); }
.saved[data-err="true"] { color: var(--change); }
.sendbox { display: grid; gap: 8px; }
.sendsteps { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 13.5px; }
.sendsteps li { color: var(--muted); padding-left: 22px; position: relative; }
.sendsteps li::before { content: ""; position: absolute; left: 2px; top: 5px; width: 10px; height: 10px; border-radius: 50%; border: 2px solid var(--line-2); }
.sendsteps li.now { color: var(--ink); font-weight: 500; }
.sendsteps li.now::before { border-color: var(--change); border-top-color: transparent; animation: spin .8s linear infinite; }
.sendsteps li.done { color: var(--approve); }
.sendsteps li.done::before { background: var(--approve); border-color: var(--approve); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: .3; } }
.meter3 { display: grid; gap: 6px; font-size: 13px; min-width: 0; }
.meter3 .ml { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.meter3 .m3s { font-weight: 600; white-space: nowrap; }
.meter3 .m3p { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--change); }
.meter3 .m3e { color: var(--muted); margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.meter3 .mi svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; vertical-align: -2px; }
.meter3 .seg { display: grid; grid-template-columns: 0.6fr 2.4fr 1fr 0.6fr; gap: 3px; }
.meter3 .seg i { display: block; height: 7px; border-radius: 4px; background: var(--line-2); overflow: hidden; }
.meter3 .seg u { display: block; height: 100%; width: 0; background: var(--accent); transition: width .6s linear; }
.meter3 .seg i[data-on="true"] u { background: var(--change); }
.meter3[data-state="queued"] .seg i[data-k="queued"] u { background: var(--line-2); }
.meter3[data-state="queued"] .seg i[data-k="queued"] { background: repeating-linear-gradient(135deg, var(--line-2) 0 4px, var(--tile) 4px 8px); animation: slide 1s linear infinite; background-size: 200% 100%; }
@keyframes slide { to { background-position: 22px 0; } }
.meter3[data-state="ready"] .m3s { color: var(--accent); }
.meter3[data-state="ready"] .seg u { background: var(--accent); }
.meter3[data-state="accepted"] .m3s { color: var(--approve); }
.meter3[data-state="accepted"] .seg u { background: var(--approve); }
.meter3.oncard { padding: 10px 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); background: var(--bg); }
.meter3.oncard .ml { gap: 6px; }
.meter3.row { width: 100%; }
button.meter3.go { font: inherit; font-size: 13px; color: inherit; text-align: left; width: 100%; cursor: pointer; border-radius: 0; transition: background .15s; }
button.meter3.go.oncard { border-left: 0; border-right: 0; }
button.meter3.go.inline { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; margin-top: 8px; max-width: 360px; }
button.meter3.go:hover, button.meter3.go:focus-visible { background: var(--tile); }
button.meter3.go:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.meter3 .mgo { font-size: 18px; line-height: 1; color: var(--muted); margin-left: 2px; }
button.meter3.go:hover .mgo { color: var(--ink); }
.meter3.inpanel { font-size: 14px; }
.meter3.inpanel .seg i { height: 9px; }
.job { display: grid; gap: 4px; font-size: 12.5px; }
.job .jt { font-weight: 600; }
.job .jb { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.job .jb i { display: block; height: 100%; background: var(--change); transition: width .6s linear; }
.job[data-state="ready"] .jb i { background: var(--accent); }
.job[data-state="ready"] .jt { color: var(--accent); }
.job[data-state="accepted"] .jb i { background: var(--approve); }
.job[data-state="accepted"] .jt { color: var(--approve); }
.job.oncard { position: absolute; left: 8px; right: 8px; bottom: 8px; background: var(--card); color: var(--ink); border-radius: 8px; padding: 6px 8px; box-shadow: var(--shadow); text-align: left; }
.job.inline { margin-top: 6px; max-width: 320px; }
.job.infoot { font-size: 12px; }
.mpanel { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 10px; margin-top: 4px; }
.mhead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.mhead .mono { font-size: 11.5px; color: var(--muted); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; gap: 6px; flex-wrap: wrap; font-size: 12.5px; }
.steps li { padding: 3px 10px; border-radius: 999px; background: var(--tile); color: var(--muted); }
.steps li.done { background: var(--approve-bg); color: var(--approve); }
.steps li.now { background: var(--ink); color: var(--card); }
.mrow { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.mrow .quiet { font-size: 12px; }
.notesum { display: flex; align-items: center; gap: 10px; font-size: 13.5px; min-width: 0; }
.notesum .ntext { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.notehead #pdp-undo { margin-left: auto; }
.notehead #pdp-done { margin-left: 0; }
.mp { padding-block: 22px 80px; display: grid; gap: 16px; }
.mtitle { display: flex; align-items: flex-start; gap: 12px; }
.mtitle > div { flex: 1; min-width: 0; }
.mtitle h2 { font-size: 26px; font-weight: 600; }
.mtitle p { margin: 4px 0 0; max-width: 70ch; }
.simtag { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--change); background: var(--change-bg); padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.flow { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.fstep { position: relative; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; text-align: left; cursor: pointer; display: grid; gap: 2px; }
.fstep b { font: 600 24px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.fstep span { font-size: 12.5px; color: var(--muted); }

.fstep[aria-pressed="true"] { border-color: var(--ink); }
.mfilters { display: flex; gap: 6px; flex-wrap: wrap; }
.mshow { display: flex; gap: 10px; align-items: baseline; font-size: 13.5px; margin: -4px 0 2px; }
.flow.six { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.fstep:disabled { cursor: default; opacity: .55; }
.fstep:not(:disabled):hover { border-color: var(--line-2); }
.chipf { border: 1px solid var(--line-2); background: var(--card); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13.5px; display: inline-flex; gap: 6px; align-items: center; }
.chipf span { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.chipf[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
.chipf[aria-pressed="true"] span { color: inherit; opacity: .7; }
.mgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 20px; align-items: start; }
.mlist { display: grid; gap: 8px; min-width: 0; overflow-anchor: none; }
.mrowi { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 4px 8px 4px 4px; min-width: 0; }
.mrowi.sel { border-color: var(--ink); box-shadow: var(--shadow); }
.mpick { all: unset; cursor: pointer; display: grid; grid-template-columns: 52px minmax(0, 1fr) minmax(0, 230px); gap: 12px; align-items: center; flex: 1; min-width: 0; padding: 6px; border-radius: 10px; }
.mpick:focus-visible { outline: 2px solid var(--accent); }
.mth { width: 52px; height: 52px; border-radius: 8px; overflow: hidden; background: var(--tile); }
.mth img { width: 100%; height: 100%; object-fit: cover; display: block; }
.mth .tile { padding: 2px; } .mth .tile .initial { font-size: 20px; } .mth .tile .stripe { inset: 14%; }
.mname { display: grid; min-width: 0; }
.mname b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mname small { color: var(--muted); font-size: 12.5px; }
.mstat { display: grid; gap: 5px; justify-items: start; min-width: 0; }
.mstat .job { width: 100%; font-size: 11.5px; }
.mstat .job .jt { font-weight: 500; color: var(--muted); }
.pill[data-js] { font-size: 11.5px; padding: 2px 9px; }
.pill[data-js="queued"] { background: var(--tile); color: var(--muted); }
.pill[data-js="modelling"], .pill[data-js="checking"] { background: var(--change-bg); color: var(--change); }
.pill[data-js="ready"] { background: var(--accent-soft); color: var(--accent); }
.pill[data-js="accepted"] { background: var(--approve-bg); color: var(--approve); }
.pill[data-js="cancelled"] { background: var(--omit-bg); color: var(--omit); }
.qmove { display: flex; flex-direction: column; gap: 4px; }
.qmove .btn.icon { width: 28px; height: 28px; font-size: 13px; }
.mdetail { position: sticky; top: calc(76px + env(safe-area-inset-top, 0px)); background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; max-height: calc(100vh - 100px); overflow: auto; }
.md { display: grid; gap: 14px; }
.mlist > .mdwrap { margin-top: -9px; }
.mlist > .mdwrap > .md { background: var(--card); border: 1px solid var(--ink); border-top: 0; border-radius: 0 0 12px 12px; padding: 14px; box-shadow: var(--shadow); }
.mrowi { transition: border-color .2s, box-shadow .2s, border-radius .2s; }
.mrowi.open { border-radius: 12px 12px 0 0; border-bottom-color: transparent; box-shadow: none; }
.mrowi .mpick[aria-expanded] { position: relative; padding-right: 26px; }
.mrowi .mpick[aria-expanded]::after { content: "⌄"; position: absolute; right: 6px; top: 8px; font-size: 18px; line-height: 1; color: var(--muted); transition: transform .25s; }
.mrowi.open .mpick[aria-expanded]::after { transform: rotate(180deg); }
.mdh { display: flex; gap: 10px; align-items: flex-start; }
.mdh > div:not(.mth) { flex: 1; min-width: 0; }
.mdh > .mth { flex: none; }
.mdh h3 { font-size: 19px; font-weight: 600; }
.md .sec textarea { width: 100%; border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 11px; background: var(--card); resize: vertical; }
.md .sec .btn { justify-self: start; }
.refs { display: flex; gap: 8px; overflow-x: auto; }
.refs img { width: 88px; height: 88px; object-fit: cover; border-radius: 8px; flex: none; }
.kvs { margin: 0; display: grid; gap: 6px; }
.kv { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 10px; font-size: 13.5px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.log li { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 8px; }
.log time { color: var(--muted); font-variant-numeric: tabular-nums; }
.mempty { background: var(--card); border: 1px dashed var(--line-2); border-radius: 16px; padding: 28px; display: grid; gap: 10px; justify-items: start; }
.mempty h3 { font-size: 19px; font-weight: 600; } .mempty p { margin: 0; color: var(--muted); max-width: 62ch; }
.lead { display: flex; align-items: center; justify-content: space-between; gap: 10px 16px; flex-wrap: wrap; padding-block: 18px 14px; }
.lead-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; min-width: 0; }
.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
.tools .search { order: 1; width: 260px; flex: 0 1 260px; }
.tools .filter { order: 2; }
.tools .lay { order: 3; }
.tools .sbtn { order: 0; }
.lead-row h2 { font-size: 20px; font-weight: 600; }
.lead-row span { color: var(--muted); font-size: 14px; }
.lead-row button { margin-left: 4px; }

/* product grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 18px; padding-bottom: 60px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .18s ease, transform .18s ease; min-width: 0; }
.card:hover { box-shadow: var(--shadow-up); transform: translateY(-2px); }
.card .ph { position: relative; aspect-ratio: 1 / 1; background: var(--tile); border: 0; padding: 0; cursor: pointer; display: block; width: 100%; overflow: hidden; }
.card .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.card .tags { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; justify-content: space-between; gap: 6px; pointer-events: none; }
.card .code { font-family: var(--f-mono); font-size: 11.5px; background: var(--card); color: var(--ink); padding: 2px 7px; border-radius: 6px; }
.card .body { padding: 12px 14px 14px; display: grid; gap: 6px; flex: 1; align-content: start; }
.card h3 { font-size: 16.5px; font-weight: 600; line-height: 1.25; }
.card h3 button { all: unset; cursor: pointer; }
.card h3 button:focus-visible { outline: 2px solid var(--accent); }
.card .sub { color: var(--muted); font-size: 13.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dots { display: flex; align-items: center; gap: 5px; min-height: 18px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; border: 1px solid var(--line-2); display: inline-block; }
.dots small { color: var(--muted); font-size: 12px; margin-left: 4px; }
.card .act { display: flex; gap: 8px; padding: 0 14px 14px; }
.card .act .btn { flex: 1; }
.btn.chosen { background: var(--approve-bg); border-color: var(--approve); color: var(--approve); }
.card[data-state="omit"] .ph { opacity: .45; }
.card[data-state="approve"], .card[data-state="changed"], .lrow[data-state="approve"], .lrow[data-state="changed"] { border-color: color-mix(in srgb, var(--approve) 38%, var(--line)); }
.card .act .btn.chosen, .lact .btn.chosen { background: var(--approve-bg); border-color: color-mix(in srgb, var(--approve) 45%, transparent); color: var(--approve); }
.tile { width: 100%; height: 100%; display: grid; align-content: end; padding: 12px; position: relative; }
.tile .stripe { position: absolute; inset: 16% 16% 22%; display: flex; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px var(--line-2), 0 10px 24px rgba(23, 26, 25, .12); }
.tile .stripe span { flex: 1; }
.tile .lab { position: relative; justify-self: start; background: var(--card); color: var(--ink); font-size: 12px; padding: 3px 8px; border-radius: 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .initial { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: 54px; font-weight: 600; color: var(--line-2); }
.line .th .tile .stripe, .gallery .big .tile .stripe { inset: 12%; }
.empty { padding: 60px 0; text-align: center; color: var(--muted); }

/* product page */
dialog { color: var(--ink); }
dialog.pdp { border: 0; padding: 0; width: min(1080px, 96vw); height: min(860px, 94vh); max-height: 94vh; border-radius: 18px; background: var(--card); box-shadow: var(--shadow-up); overflow: hidden; }
dialog.pdp[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgba(12, 15, 14, .6); }
.pdp-top { display: flex; align-items: center; gap: 10px; padding: 10px 14px 10px 20px; border-bottom: 1px solid var(--line); }
.pdp-top .crumbs { margin-right: auto; font-size: 13px; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pdp-scroll { overflow: auto; flex: 1; overscroll-behavior: contain; }
.pdp-main { display: grid; grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr); gap: 32px; padding: 24px; align-items: start; }
.colL { display: grid; gap: 14px; position: sticky; top: 0; min-width: 0; }
.colR { display: grid; gap: 14px; min-width: 0; align-content: start; }
.head, .body { display: grid; gap: 14px; min-width: 0; }
.gallery { display: grid; gap: 10px; }
.gallery .big { aspect-ratio: 1 / 1; border-radius: 14px; overflow: hidden; background: var(--tile); }
.gallery .big img { width: 100%; height: 100%; object-fit: contain; display: block; }
.gallery .thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.gallery .thumbs button { width: 60px; height: 60px; flex: none; border-radius: 8px; overflow: hidden; border: 2px solid transparent; padding: 0; cursor: pointer; background: var(--tile); }
.gallery .thumbs button[aria-current="true"] { border-color: var(--ink); }
.gallery .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery .miss { font-size: 12.5px; color: var(--muted); }
.about { border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 12px; }
.about dl { margin: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
.about .fact { display: grid; gap: 1px; min-width: 0; }
.about .fact.wide { grid-column: 1 / -1; }
.about dt { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.about dd { margin: 0; font-size: 14px; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; min-width: 0; }
.about blockquote { margin: 0; font-size: 13.5px; color: var(--muted); border-left: 2px solid var(--line-2); padding: 2px 0 2px 12px; }
.about .miss { font-size: 12.5px; color: var(--muted); }
.linkbtn { border: 0; background: none; padding: 0; color: var(--accent); font-weight: 500; cursor: pointer; display: inline-flex; gap: 5px; align-items: center; text-align: left; text-decoration: underline; text-decoration-color: transparent; text-underline-offset: 3px; }
.linkbtn:hover { text-decoration-color: currentColor; }
.linkbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; flex: none; }
.mini { font-size: 11.5px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.mini.ok { background: var(--approve-bg); color: var(--approve); }
.mini.warn { background: var(--change-bg); color: var(--change); }
.mini.chg { background: var(--accent-soft); color: var(--accent); }
.assume { border-radius: 12px; padding: 12px 14px; background: var(--bg); display: flex; gap: 14px; align-items: center; font-size: 14px; }
.assume .atext { display: grid; gap: 4px; flex: 1; min-width: 0; }
.thumb3d { flex: none; display: grid; justify-items: center; gap: 2px; border: 1px solid var(--line-2); background: var(--card); border-radius: 12px; padding: 6px 8px 7px; cursor: pointer; color: var(--accent); font-size: 12px; font-weight: 600; }
.thumb3d:hover { border-color: var(--ink); }
.thumb3d canvas { width: 84px; height: 84px; display: block; color: var(--ink); }
.thumb3d span { display: inline-flex; gap: 4px; align-items: center; }
.thumb3d svg, .view3d svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; }
.selrow { display: flex; gap: 8px; align-items: center; min-width: 0; }
.selrow .libsel { flex: 1; }
.view3d { flex: none; padding: 8px 12px; }
.chk.newobj { justify-self: start; margin-top: 4px; font-size: 13.5px; padding: 6px 12px; }
.chk.newobj.on { border-color: var(--ink); background: var(--tile); font-weight: 500; }
.libsel:disabled { opacity: .55; }
dialog.viewer { width: min(640px, 94vw); }
.v3wrap { position: relative; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
.v3 { display: block; width: 100%; aspect-ratio: 4 / 3; cursor: grab; touch-action: none; color: var(--ink); }
.v3:active { cursor: grabbing; }
.v3tag { position: absolute; left: 10px; top: 10px; font-size: 11.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; }
.seg2 { display: flex; border: 1px solid var(--line-2); border-radius: 999px; overflow: hidden; }
.seg2 button { flex: 1; border: 0; background: var(--card); padding: 7px 12px; cursor: pointer; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.seg2 button + button { border-left: 1px solid var(--line-2); }
.seg2 button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.assume.warn { background: var(--change-bg); }
.assume .why { font-size: 13px; color: var(--muted); }
.libsel { width: 100%; border: 1px solid var(--line-2); border-radius: 10px; padding: 9px 12px; background: var(--card); min-width: 0; }
.f.changed .libsel { border-color: var(--change); box-shadow: 0 0 0 3px var(--change-bg); }
.f .hint { font-size: 12.5px; color: var(--muted); }
.f .path { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); overflow-wrap: anywhere; }
details.edit-links summary { cursor: pointer; font-size: 13px; color: var(--muted); padding-block: 4px; }

      await HOST.request("library.write", { path: D.host.decisionsPath, content: body, overwrite: true });
      sendState = { step: "applying" }; renderSignoff();
      const r = await HOST.request("pipeline.run", { pipeline: "build-from-deck", step: "review.apply", code: D.code, decisions: D.host.decisionsPath }, 180000);
      sendState = { step: "done", result: r.result || {}, at: Date.now() };
      toast(sendState.result.status === "approved" ? "Signed off. The build can continue" : "Sent. The review stays open for the rest");
    } catch (e) {
      sendState = { step: "error", error: e.message };
    }
    renderSignoff();
  }
  function sendPanel() {
    const st = sendState.step;
    if (st === "idle") return h("div", { class: "quiet", style: "font-size:13px" }, "Saves your decisions to the project and applies them to the brief.");
    const steps = [["saving", "Saved to the library"], ["applying", "Applied to the brief"]];
    const at = st === "saving" ? 0 : st === "applying" ? 1 : st === "done" ? 2 : -1;
    const r = sendState.result || {};
    return h("div", { class: "sendbox", "data-step": st },
      st === "error" ? h("div", { class: "warn" }, `Not sent: ${sendState.error}. Your work is still here; try again or download a copy.`)
        : h("ol", { class: "sendsteps" }, steps.map(([k, t], i) => h("li", { class: i < at ? "done" : i === at ? "now" : "" }, t))),
      st === "done" ? h("div", { class: r.status === "approved" ? "ok" : "warn" },
        r.status === "approved" ? `Review approved by ${r.reviewer}. The build moves on to layout and library binding.`
          : `Saved and applied. The review is still open: ${(r.counts || {}).pending || 0} to review. The editor rebuilds this page so you can finish the rest.`,
        (r.newObjects || []).length ? ` ${r.newObjects.length} new 3D model request${r.newObjects.length > 1 ? "s" : ""} queued for modelling.` : "") : null,
      st === "done" && r.status !== "approved" ? h("button", { class: "btn sm", type: "button", id: "reload", onclick: () => location.reload() }, "Reload the review") : null);
  }

  // ---------- output
  const fname = `${D.code}.review.json`;
  function decisions() {
    const items = {};
    for (const it of D.items) {
      const s = S.items[it.id];
      if (!s.decision) continue;
      items[it.id] = { decision: s.decision, ...edits(it.id), library: { object: s.lib.object, material: s.lib.material || null, pipeline: it.library.pipeline,
                         ...(s.lib.object === "new" && S.jobs[it.id] && !S.jobs[it.id].cancelledAt ? { request: { id: S.jobs[it.id].jobId, rev: S.jobs[it.id].rev, requestedAt: iso(S.jobs[it.id].createdAt), pageStatus: jstate(S.jobs[it.id]),
                           feedback: (S.jobs[it.id].feedback || []).map(f => ({ rev: f.rev, at: iso(f.at), text: f.text })) } } : {}) },
                       ...(s.comment.trim() ? { comment: s.comment.trim() } : {}) };
    }
    return { schema: "roombrief.review/1", code: D.code, project: D.project, room: D.room, briefSha: D.briefSha,
             reviewer: S.reviewer.trim() || null, exportedAt: new Date().toISOString().replace(/\.\d+Z$/, "Z"), items };
  }
  const text = () => JSON.stringify(decisions(), null, 1);
  function iso(t) { return new Date(t).toISOString().replace(/\.\d+Z$/, "Z"); }
  const toast = m => { const t = $("#toast"); t.textContent = m; t.hidden = false; t.style.bottom = window.innerWidth <= 640 && !dlg.open && view === "shop" ? "calc(84px + env(safe-area-inset-bottom, 0px))" : ""; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2400); };
  const ready = () => {
    const bad = D.items.filter(it => { const s = S.items[it.id]; return (s.decision === "question" || s.decision === "omit") && !s.comment.trim(); });
    if (bad.length) { toast(`Add a comment to ${bad[0].id} first`); openPdp(bad[0].id); return false; }
    return true;
  };
  function copy() {
    if (!ready()) return;
    const t = text();
    const fallback = () => { showFile = true; renderSignoff(); const pre = $("#json"); const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); pre.scrollIntoView({ block: "nearest" }); toast("Selected. Press Ctrl+C or Cmd+C to copy"); };
    try { navigator.clipboard.writeText(t).then(() => toast(`Copied. Save it as ${fname}`), fallback); } catch (e) { fallback(); }
  }
  function download() {
    if (!ready()) return;
    try {
      const a = h("a", { href: URL.createObjectURL(new Blob([text()], { type: "application/json" })), download: fname });
      document.body.append(a); a.click(); a.remove();
      toast(`Downloaded ${fname}. If nothing saved, use Copy decisions`);
    } catch (e) { copy(); }
  }

  // ---------- views + render loop (batched; keeps focus on the same control)
  const HASH = { shop: "#selections", models: "#models", compose: "#room" };
  const fromHash = () => (Object.entries(HASH).find(([, v]) => v === location.hash) || ["shop"])[0];
  let view = "shop";
  const setView = (v, quiet) => {
    if (v === "compose" && !CP) v = "shop";
    view = v; $("#toast").hidden = true; $("#shop").hidden = v !== "shop"; $("#models").hidden = v !== "models"; $("#compose").hidden = v !== "compose";
    try { if (location.hash !== HASH[v]) history.replaceState(null, "", HASH[v]); } catch (e) {}
    render(); if (!quiet) window.scrollTo({ top: 0 });
  };
  window.addEventListener("hashchange", () => { const v = fromHash(); if (v !== view) setView(v); });
  function openModels(id) { if (id) mSel = id; setView("models"); }
  $("#bagbtn").onclick = openSignoff;
  $("#sbtn").onclick = () => { const box = $("#searchbox"), open = !box.classList.contains("open"); box.classList.toggle("open", open); $("#sbtn").setAttribute("aria-expanded", String(open)); if (open) $("#q").focus(); };
  $("#q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); render(); });
  $("#status").addEventListener("change", e => { status = e.target.value; render(); });
  function render() {
    const a = document.activeElement, fid = a && a.id, sel = a && "selectionStart" in a ? [a.selectionStart, a.selectionEnd] : null;
    renderBar();
    if (view === "shop") { renderRail(); renderGrid(); } else if (view === "compose") renderCompose(); else renderModels();
    if (sheet.open) renderSignoff();
    renderStages();
    renderPdp();
    const back = fid && document.getElementById(fid);
    if (back && back !== a) { back.focus({ preventScroll: true }); if (sel) try { back.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
  }
  let queued = false;
  function changed() { persist(); if (!queued) { queued = true; setTimeout(() => { queued = false; render(); }, 0); } }
  const dl = (id, vals) => document.body.append(h("datalist", { id }, vals.map(v => h("option", { value: v }))));
  dl("dl-kinds", D.suggest.kinds); dl("dl-materials", D.suggest.materials);
  advance(); persist(true);
  if (fromHash() !== "shop") setView(fromHash(), true); else render();
}
</script>
