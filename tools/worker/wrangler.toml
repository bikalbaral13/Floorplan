name = "builderpluss-library"
main = "src/index.js"
compatibility_date = "2025-09-01"

# The library bucket, bound by name — the Worker never holds S3 keys.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "builderpluss"

[vars]
PREFIX = "library/"
# W1 testing mode: anyone may write the allowed prefixes. Later: "roles" (library/Config/roles.json + Access).
WRITE_MODE = "open"
# Pages allowed to call the API from a browser (comma separated).
ALLOWED_ORIGINS = "https://pub-156fd74325894cccb9467e68a6e5cc82.r2.dev,http://localhost:2500,http://localhost:8787"
# Hard cap on one saved file (bytes). The largest design today is ~31 MB.
MAX_BYTES = "64000000"
