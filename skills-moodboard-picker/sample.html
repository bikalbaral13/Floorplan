<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Moodboard Picker - Sample</title>
<!--
  Moodboard picker — reads a moodboard/1 JSON, lets the user choose one option per room,
  and exports the same JSON with rooms[].selection filled. The JSON stays the source of truth.

  Load:  ?src=library/Moodboards/<id>.json   (R2 key, resolved against the public bucket)
         ?src=https://...                    (any URL with CORS)
         or "Open file" / drag a .json onto the page.
  Draft picks are kept in this browser only (localStorage) until exported.

  EMBEDDED (?embed=1, inside the floorplan editor): the page does not fetch — it posts
  {type:"moodboard:ready"} to its parent and waits for {type:"moodboard:load", json, name}.
  "Save to plan" posts {type:"moodboard:save", moodboard} and Cancel posts {type:"moodboard:cancel"};
  the editor stores only the picked options on the plan. No localStorage drafts in this mode — the
  plan's own picks arrive already merged into json.rooms[].selection.
  Images carry crossorigin="anonymous": the editor's dev server sends COEP require-corp (web-ifc
  threads), which blocks a plain cross-origin <img>; a CORS request passes (the bucket allows *).
  ?public=<origin> overrides the bucket images resolve against (the app passes its Library Path).
-->
<style>
:root{
  --bg:#f7f5f1; --panel:#ffffff; --ink:#1f1d1a; --muted:#6f6a62; --line:#e4dfd6;
  --accent:#8a6a3b; --accent-ink:#fff; --open:#b9b3a8; --short:#c7902f; --lock:#2f7d57;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#161513; --panel:#1f1d1a; --ink:#ece8e1; --muted:#a39d93; --line:#34312c;
  --accent:#c9a46a; --accent-ink:#1a1712; --open:#5d5850; --short:#d9a54a; --lock:#4fb383;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}}
:root[data-theme="dark"]{
  --bg:#161513; --panel:#1f1d1a; --ink:#ece8e1; --muted:#a39d93; --line:#34312c;
  --accent:#c9a46a; --accent-ink:#1a1712; --open:#5d5850; --short:#d9a54a; --lock:#4fb383;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}
button,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 20px;max-width:1500px;margin:0 auto}
.title h1{margin:0;font-size:18px;letter-spacing:.02em}
.title div{color:var(--muted);font-size:12px}
.grow{flex:1}
.progress{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.progress .track{width:140px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.progress .fill{height:100%;background:var(--lock);width:0;transition:width .3s}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.menuwrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:210px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.14);padding:4px;z-index:20;display:none}
.menu.on{display:block}
.menu button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:8px 10px;border-radius:7px;cursor:pointer}
.menu button:hover{background:var(--bg)}
.menu button b{font-size:13px;font-weight:600}
.menu button span{font-size:11px;color:var(--muted)}
.busy{cursor:progress;opacity:.7}
.by{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 10px;width:150px}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:6px 10px;border-radius:6px;cursor:pointer;color:var(--muted)}
.tab.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.layout{display:grid;grid-template-columns:230px 1fr;gap:24px;max-width:1500px;margin:0 auto;padding:20px}
nav{position:sticky;top:78px;align-self:start;max-height:calc(100vh - 100px);overflow:auto}
nav a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:13px}
nav a:hover{background:var(--panel)}
nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 8px 4px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--open)}
.dot.shortlisted{background:var(--short)} .dot.locked{background:var(--lock)}
nav .thumb{width:26px;height:26px;border-radius:4px;object-fit:cover;margin-left:auto;opacity:.9}
section.room{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:22px;box-shadow:var(--shadow);scroll-margin-top:90px}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:12px}
.rhead h2{margin:0;font-size:17px}
.rhead .bind{font-size:12px;color:var(--muted)}
.status{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-left:auto}
.status button{border:0;background:none;padding:5px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.status button.on[data-s="open"]{background:var(--open);color:#fff}
.status button.on[data-s="shortlisted"]{background:var(--short);color:#fff}
.status button.on[data-s="locked"]{background:var(--lock);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{position:relative;border:2px solid transparent;border-radius:12px;overflow:hidden;background:var(--bg);cursor:pointer;transition:border-color .15s,transform .15s}
.card:hover{transform:translateY(-2px)}
.card.sel{border-color:var(--accent)}
.card.dim{opacity:.55}
.card .img{position:relative;aspect-ratio:3/4;background:var(--line)}
.card img{width:100%;height:100%;object-fit:cover;display:block}
.card .zoom{position:absolute;right:8px;top:8px;border:0;border-radius:6px;background:rgba(0,0,0,.55);color:#fff;padding:3px 7px;cursor:zoom-in;font-size:12px}
.card .badge{position:absolute;left:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px}
.card.sel .badge{background:var(--accent);color:var(--accent-ink)}
.card .body{padding:10px 12px 12px}
.card .take{font-size:13px;margin-bottom:8px}
.pal{display:flex;height:10px;border-radius:3px;overflow:hidden;margin-bottom:8px}
.pal span{flex:1}
.tags{display:flex;flex-wrap:wrap;gap:4px}
details.more{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px;font-size:12px}
details.more summary{cursor:pointer;color:var(--accent);font-weight:600;list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary::before{content:"▸";transition:transform .15s}
details.more[open] summary::before{transform:rotate(90deg)}
details.more h4{margin:8px 0 4px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
details.more ul{margin:0;padding-left:16px}
details.more li{margin:1px 0}
details.more .mat{display:grid;grid-template-columns:auto 1fr;gap:2px 8px}
details.more .mat .sf{color:var(--muted);text-transform:capitalize}
.card .dflt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:2px 7px;font-size:11px}
.tags span{font-size:11px;border:1px solid var(--line);border-radius:10px;padding:1px 7px;color:var(--muted)}
.note{margin-top:12px;width:100%;min-height:38px;resize:vertical;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:8px 10px}
.summary{display:flex;gap:8px;overflow-x:auto;padding:4px 20px 12px;max-width:1500px;margin:0 auto}
.summary .s{flex:none;width:64px;text-align:center;font-size:10px;color:var(--muted);cursor:pointer}
.summary .s .ph{width:64px;height:64px;border-radius:8px;background:var(--line);overflow:hidden;border:2px solid transparent}
.summary .s .ph.locked{border-color:var(--lock)} .summary .s .ph.shortlisted{border-color:var(--short)}
.summary img{width:100%;height:100%;object-fit:cover}
.empty{max-width:560px;margin:80px auto;text-align:center;color:var(--muted)}
.empty.drag{outline:2px dashed var(--accent);outline-offset:12px;border-radius:12px}
dialog{border:0;padding:0;background:transparent;max-width:94vw;max-height:94vh}
dialog::backdrop{background:rgba(0,0,0,.8)}
dialog img{max-width:94vw;max-height:88vh;display:block;border-radius:8px}
dialog .cap{color:#eee;padding:8px 2px;font-size:13px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:820px){
  header{position:static}
  .by{width:120px}
  .layout{grid-template-columns:1fr;padding:16px}
  nav{display:none}
  .bar{padding:10px 16px}
  .progress .track{width:80px}
  .cards{grid-template-columns:repeat(2,1fr);gap:10px}
  .summary{padding:4px 16px 10px}
}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="title"><h1 id="t">Moodboard picker</h1><div id="st">Load a moodboard to start</div></div>
    <div class="tabs" id="tabs"></div>
    <div class="grow"></div>
    <div class="progress"><span id="pc">0 / 0 locked</span><div class="track"><div class="fill" id="pf"></div></div></div>
    <input class="by" id="by" placeholder="Your name" aria-label="Picked by">
    <label class="btn">Open file<input type="file" id="file" accept=".json,application/json" hidden></label>
    <div class="menuwrap">
      <button class="btn primary" id="exp" disabled aria-haspopup="menu" aria-expanded="false">Export ▾</button>
      <div class="menu" id="expmenu" role="menu">
        <button role="menuitem" data-exp="json"><b>Export JSON</b><span>Selected option per room (option 1 if none)</span></button>
        <button role="menuitem" data-exp="pdf"><b>Export PDF</b><span>Whole board — every room, all options</span></button>
        <button role="menuitem" data-exp="pdf-selected"><b>Export Selected PDF</b><span>One page per room, chosen option only</span></button>
      </div>
    </div>
  </div>
  <div class="summary" id="sum"></div>
</header>
<div id="app"><div class="empty" id="drop">
  <p>Loading…</p>
</div></div>
<dialog id="lb"><img id="lbi" alt="" crossorigin="anonymous"><div class="cap" id="lbc"></div></dialog>
<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const QS = new URLSearchParams(location.search);
const PUBLIC = (QS.get("public") || "https://pub-156fd74325894cccb9467e68a6e5cc82.r2.dev").replace(/\/+$/, "");
const EMBED = QS.get("embed") === "1";
const DEFAULT_SRC = "library/Moodboards/ramanadhapuram-apartment-interior.json";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const url = k => /^https?:|^data:|^blob:/.test(k) ? k : `${PUBLIC}/${k.split("/").map(encodeURIComponent).join("/")}`;
const store = {
  get(k){ try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
  set(k,v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k){ try { localStorage.removeItem(k); } catch {} }
};
let mb = null, group = "all", srcName = "moodboard.json";

function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("on"),1800); }
const draftKey = () => `mbpick:${mb.id}`;
function saveDraft(){
  if (EMBED) return;
  store.set(draftKey(), Object.fromEntries(mb.rooms.map(r => [r.roomKey, r.selection])));
  store.set("mbpick:by", $("#by").value);
}

function load(json, name){
  if (json?.schema !== "moodboard/1" || !Array.isArray(json.rooms)) { fail("Not a moodboard/1 file."); return; }
  mb = json; srcName = name || `${mb.id}.json`;
  const draft = EMBED ? {} : (store.get(draftKey()) || {});
  for (const r of mb.rooms) {
    r.selection = { optionId:null, status:"open", by:null, note:null, ...(r.selection||{}), ...(draft[r.roomKey]||{}) };
  }
  $("#by").value = store.get("mbpick:by") || "";
  $("#t").textContent = mb.title || mb.id;
  $("#st").textContent = [mb.project, mb.author, mb.issued].filter(Boolean).join(" · ");
  const groups = [...new Set(mb.rooms.map(r => r.group || "rooms"))];
  $("#tabs").innerHTML = groups.length > 1
    ? ["all", ...groups].map(g => `<button class="tab${g===group?" on":""}" data-g="${esc(g)}">${esc(g[0].toUpperCase()+g.slice(1))}</button>`).join("") : "";
  $("#exp").disabled = false;
  render();
}
function fail(m){ $("#app").innerHTML = `<div class="empty" id="drop"><p>${esc(m)}</p><p>Open a moodboard JSON file or drag one here.</p></div>`; }

function roomSel(r){ return r.references.find(x => x.id === r.selection.optionId); }

function render(){
  const rooms = mb.rooms.filter(r => group === "all" || (r.group||"rooms") === group);
  const groups = [...new Set(rooms.map(r => r.group || "rooms"))];
  $("#app").innerHTML = `<div class="layout"><nav>${groups.map(g => `<div class="grp">${esc(g)}</div>` +
    rooms.filter(r => (r.group||"rooms")===g).map(r => { const s=roomSel(r);
      return `<a href="#${esc(r.roomKey)}"><span class="dot ${r.selection.status}"></span>${esc(r.label)}${s?`<img class="thumb" crossorigin="anonymous" src="${esc(url(s.src))}" alt="">`:""}</a>`; }).join("")).join("")}
    </nav><main>${rooms.map(roomHtml).join("")}</main></div>`;
  summary(); progress();
}
/** Objects and materials of one option, folded under "Details" so the card stays an image first. */
function detailsHtml(o){
  const objs = o.objects || [], mats = o.materials || [];
  if (!objs.length && !mats.length) return "";
  return `<details class="more"><summary>Details · ${objs.length} objects · ${mats.length} materials</summary>
    ${objs.length ? `<h4>Objects</h4><ul>${objs.map(n => `<li>${esc(n)}</li>`).join("")}</ul>` : ""}
    ${mats.length ? `<h4>Materials</h4><div class="mat">${mats.map(m => `<span class="sf">${esc(m.surface)}</span><span>${esc(m.name)}</span>`).join("")}</div>` : ""}
  </details>`;
}
function roomHtml(r){
  const b = r.bind || {}, st = r.selection.status;
  return `<section class="room" id="${esc(r.roomKey)}" data-room="${esc(r.roomKey)}">
    <div class="rhead"><h2>${esc(r.label)}</h2>
      <span class="bind">${esc(b.roomType||"")}${b.spaceNames?.length?` · matches ${esc(b.spaceNames.join(", "))}`:""}</span>
      <div class="status">${["open","shortlisted","locked"].map(s => `<button data-s="${s}" class="${s===st?"on":""}">${s[0].toUpperCase()+s.slice(1)}</button>`).join("")}</div>
    </div>
    <div class="cards">${r.references.map(o => { const sel = o.id === r.selection.optionId;
      return `<div class="card${sel?" sel":""}${r.selection.optionId&&!sel?" dim":""}" data-opt="${esc(o.id)}" tabindex="0" role="button" aria-pressed="${sel}">
        <div class="img"><img loading="lazy" crossorigin="anonymous" src="${esc(url(o.src))}" alt="${esc(o.takeaway)}">
          <span class="badge">${sel?"✓ ":""}Option ${o.option}</span><button class="zoom" data-zoom="${esc(o.id)}" aria-label="Enlarge">⤢</button>
          ${!r.selection.optionId && o.option === 1 ? `<span class="dflt" title="Exported for this room unless you pick another">Default</span>` : ""}</div>
        <div class="body"><div class="take">${esc(o.takeaway)}</div>
          ${o.palette?.length?`<div class="pal">${o.palette.map(h=>`<span style="background:${esc(h)}" title="${esc(h)}"></span>`).join("")}</div>`:""}
          <div class="tags">${(o.tags||[]).map(t=>`<span>${esc(t)}</span>`).join("")}</div>
          ${detailsHtml(o)}</div></div>`; }).join("")}</div>
    <textarea class="note" placeholder="Note for this room (optional)">${esc(r.selection.note||"")}</textarea>
  </section>`;
}
function summary(){
  $("#sum").innerHTML = mb.rooms.map(r => { const s = roomSel(r);
    return `<div class="s" data-jump="${esc(r.roomKey)}" title="${esc(r.label)}"><div class="ph ${r.selection.status}">${s?`<img crossorigin="anonymous" src="${esc(url(s.src))}" alt="">`:""}</div>${esc(r.label.split(":")[0].replace("Clubhouse","Club"))}</div>`; }).join("");
}
function progress(){
  const n = mb.rooms.length, l = mb.rooms.filter(r => r.selection.status==="locked").length;
  $("#pc").textContent = `${l} / ${n} locked`; $("#pf").style.width = `${n?100*l/n:0}%`;
}
const findRoom = k => mb.rooms.find(r => r.roomKey === k);
function touch(r){ r.selection.by = $("#by").value.trim() || null; r.selection.at = new Date().toISOString(); saveDraft(); }

function pick(r, id){
  if (r.selection.status === "locked") { toast("Unlock the room to change its pick"); return; }
  r.selection.optionId = r.selection.optionId === id ? null : id;
  r.selection.status = r.selection.optionId ? "shortlisted" : "open";
  touch(r); refreshRoom(r);
}
function setStatus(r, s){
  if (s !== "open" && !r.selection.optionId) { toast("Pick an option first"); return; }
  r.selection.status = s; if (s === "open") r.selection.optionId = null;
  touch(r); refreshRoom(r);
}
function refreshRoom(r){
  const el = document.querySelector(`section[data-room="${CSS.escape(r.roomKey)}"]`);
  const note = el.querySelector(".note").value;
  el.outerHTML = roomHtml(r);
  const fresh = document.querySelector(`section[data-room="${CSS.escape(r.roomKey)}"]`);
  fresh.querySelector(".note").value = note;
  const a = document.querySelector(`nav a[href="#${CSS.escape(r.roomKey)}"]`);
  if (a) { const s = roomSel(r); a.innerHTML = `<span class="dot ${r.selection.status}"></span>${esc(r.label)}${s?`<img class="thumb" crossorigin="anonymous" src="${esc(url(s.src))}" alt="">`:""}`; }
  summary(); progress();
}

document.addEventListener("click", e => {
  const t = e.target;
  if (t.closest(".tab")) { group = t.closest(".tab").dataset.g; document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.g===group)); render(); return; }
  if (t.closest("[data-jump]")) { const k=t.closest("[data-jump]").dataset.jump; if (group!=="all" && (findRoom(k).group||"rooms")!==group){ group="all"; document.querySelectorAll(".tab").forEach(b => b.classList.toggle("on", b.dataset.g===group)); render(); } document.getElementById(k)?.scrollIntoView({behavior:"smooth"}); return; }
  const sec = t.closest("section.room"); if (!sec) return;
  const r = findRoom(sec.dataset.room);
  if (t.closest("[data-zoom]")) { const o = r.references.find(x => x.id === t.closest("[data-zoom]").dataset.zoom);
    $("#lbi").src = url(o.src); $("#lbc").textContent = `${r.label} · Option ${o.option} — ${o.takeaway}`; $("#lb").showModal(); return; }
  if (t.closest(".status button")) { setStatus(r, t.closest(".status button").dataset.s); return; }
  if (t.closest("details.more")) return;   // reading the details is not a pick
  if (t.closest(".card")) pick(r, t.closest(".card").dataset.opt);
});
document.addEventListener("keydown", e => {
  const c = e.target.closest?.(".card"); if (c && (e.key==="Enter"||e.key===" ")) { e.preventDefault(); c.click(); }
});
document.addEventListener("input", e => {
  if (e.target.classList.contains("note")) { const r = findRoom(e.target.closest("section").dataset.room); r.selection.note = e.target.value || null; touch(r); }
  if (e.target.id === "by") store.set("mbpick:by", e.target.value);
});
$("#lb").addEventListener("click", () => $("#lb").close());

/** The export: per room ONLY the chosen option — not the other three. A room nobody picked exports
 *  option 1 and says so (`defaulted: true`, status "default"), so a consumer can tell a decision from a
 *  fallback. Board-level fields other than identity are left out: they describe the menu, not the order. */
function selectionExport(){
  return {
    schema: "moodboard-selection/1",
    board: mb.id, title: mb.title, project: mb.project,
    source: srcName,
    exportedAt: new Date().toISOString(),
    by: $("#by").value.trim() || null,
    rooms: mb.rooms.map((r) => {
      const chosen = roomSel(r);
      const o = chosen || r.references.find((x) => x.option === 1) || r.references[0];
      const { source: _src, ...option } = o;
      return {
        roomKey: r.roomKey, label: r.label, group: r.group, bind: r.bind,
        status: chosen ? r.selection.status : "default",
        defaulted: !chosen,
        note: r.selection.note || null,
        at: chosen ? r.selection.at || null : null,
        option: { ...option, image: url(o.src) },
      };
    }),
  };
}

$("#exp").addEventListener("click", (e) => {
  if (EMBED) { const out = structuredClone(mb); out.selectionExportedAt = new Date().toISOString(); parent.postMessage({type:"moodboard:save", moodboard: out}, "*"); return; }
  e.stopPropagation();
  const on = $("#expmenu").classList.toggle("on");
  $("#exp").setAttribute("aria-expanded", String(on));
});
document.addEventListener("click", (e) => { if (!e.target.closest(".menuwrap")) { $("#expmenu").classList.remove("on"); $("#exp").setAttribute("aria-expanded", "false"); } });
$("#expmenu").addEventListener("click", (e) => {
  const kind = e.target.closest("[data-exp]")?.dataset.exp;
  if (!kind) return;
  $("#expmenu").classList.remove("on");
  if (kind === "json") exportJson();
  else exportPdf(kind === "pdf-selected");
});

const baseName = () => srcName.replace(/\.json$/, "");
function download(blob, name){
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: name });
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportJson(){

/* ── PDF ────────────────────────────────────────────────────────────────────────────────────────
   jsPDF, A4 landscape, drawn directly (not a print of the page) so the file downloads in one click
   and looks the same everywhere. Images are fetched through a CORS-clean <img> onto a canvas and
   embedded as JPEG, scaled to what the page needs — a full board stays a few MB, not 50. */
const imgCache = new Map();
function loadImage(src, maxPx = 900){
  if (imgCache.has(src + maxPx)) return imgCache.get(src + maxPx);
  const p = new Promise((resolve) => {
    const im = new Image(); im.crossOrigin = "anonymous";
    im.onload = () => {
      const k = Math.min(1, maxPx / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(im.naturalWidth * k); c.height = Math.round(im.naturalHeight * k);
      c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
      resolve({ data: c.toDataURL("image/jpeg", 0.82), w: c.width, h: c.height });
    };
    im.onerror = () => resolve(null);
    im.src = src;
  });
  imgCache.set(src + maxPx, p);
  return p;
}
const hexRgb = (h) => { const m = /^#?([0-9a-f]{6})$/i.exec(h || ""); const n = m ? parseInt(m[1], 16) : 0xcccccc; return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };

async function exportPdf(selectedOnly){
  if (!window.jspdf) { toast("PDF library did not load — check the internet connection"); return; }
  const btn = $("#exp"); btn.classList.add("busy"); btn.textContent = "Preparing PDF…";
  try {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: "landscape", unit: "mm", format: "a4" });
    const W = 297, H = 210, M = 12;
    const INK = [31, 29, 26], MUTED = [111, 106, 98], ACC = [138, 106, 59], LINE = [228, 223, 214];
    const sel = selectionExport();
    const text = (t, x, y, { size = 10, color = INK, bold = false, maxW = null, lh = 1.25 } = {}) => {
      doc.setFont("helvetica", bold ? "bold" : "normal"); doc.setFontSize(size); doc.setTextColor(...color);
      const lines = maxW ? doc.splitTextToSize(String(t ?? ""), maxW) : [String(t ?? "")];
      doc.text(lines, x, y, { lineHeightFactor: lh });
      return y + lines.length * size * 0.3528 * lh;
    };
    const fitImage = async (src, x, y, w, h, px) => {
      const im = await loadImage(url(src), px);
      doc.setFillColor(...LINE); doc.rect(x, y, w, h, "F");
      if (!im) return;
      const k = Math.min(w / im.w, h / im.h), iw = im.w * k, ih = im.h * k;
      doc.addImage(im.data, "JPEG", x + (w - iw) / 2, y + (h - ih) / 2, iw, ih);
    };
    const palette = (pal, x, y, w) => { (pal || []).forEach((h, i, a) => { doc.setFillColor(...hexRgb(h)); doc.rect(x + (w / a.length) * i, y, w / a.length, 2.2, "F"); }); };
    const footer = (n) => { text(`${mb.title || mb.id}  ·  ${mb.project || ""}`, M, H - 6, { size: 7, color: MUTED }); text(String(n), W - M, H - 6, { size: 7, color: MUTED }); };
    const heading = (r, sub) => {
      text(r.label, M, M + 6, { size: 18, bold: true });
      text(sub, M, M + 12, { size: 9, color: MUTED });
      doc.setDrawColor(...LINE); doc.line(M, M + 15, W - M, M + 15);
    };
    const detailBlock = (o, x, y, w, size) => {
      if (o.objects?.length) { y = text("OBJECTS", x, y, { size: size - 1.5, color: MUTED, bold: true }) + 0.5; y = text(o.objects.map((n) => `• ${n}`).join("\n"), x, y, { size, maxW: w }) + 1.5; }
      if (o.materials?.length) { y = text("MATERIALS", x, y, { size: size - 1.5, color: MUTED, bold: true }) + 0.5; y = text(o.materials.map((m) => `${m.surface}: ${m.name}`).join("\n"), x, y, { size, maxW: w }); }
      return y;
    };

    // cover
    text(mb.title || mb.id, M, 60, { size: 26, bold: true, maxW: W - 2 * M });
    text([mb.project, mb.author, mb.issued].filter(Boolean).join("  ·  "), M, 74, { size: 11, color: MUTED });
    text(selectedOnly ? "Selected options — one per room" : "All options", M, 84, { size: 12, color: ACC, bold: true });
    const d = sel.rooms.filter((x) => x.defaulted).length;
    text(`${sel.rooms.length} rooms · ${sel.rooms.length - d} picked · ${d} on option 1 by default${sel.by ? ` · by ${sel.by}` : ""}  ·  ${new Date().toLocaleDateString()}`, M, 92, { size: 9, color: MUTED });
    if (mb.cover) await fitImage(mb.cover, W - M - 120, 40, 120, 90, 1200);
    let page = 1; footer(page);

    for (const r of mb.rooms) {
      const s = sel.rooms.find((x) => x.roomKey === r.roomKey);
      doc.addPage(); page++;
      if (selectedOnly) {
        const o = s.option;
        heading(r, `${s.defaulted ? "Option 1 (default — not picked)" : `Option ${o.option} · ${s.status}`}${s.note ? `  ·  Note: ${s.note}` : ""}`);
        const top = M + 20, ih = H - top - 18, iw = 150;
        await fitImage(o.src, M, top, iw, ih, 1400);
        let y = top + 2, x = M + iw + 8, w = W - x - M;
        y = text(o.takeaway || "", x, y + 4, { size: 12, bold: true, maxW: w }) + 2;
        palette(o.palette, x, y, w); y += 6;
        if (o.tags?.length) y = text(o.tags.join("  ·  "), x, y, { size: 8.5, color: MUTED, maxW: w }) + 3;
        detailBlock(o, x, y, w, 9.5);
      } else {
        heading(r, `${r.references.length} options${s.defaulted ? "" : `  ·  chosen: option ${s.option.option} (${s.status})`}`);
        const top = M + 20, gap = 5, n = r.references.length, cw = (W - 2 * M - gap * (n - 1)) / n, ih = 72;
        for (const [i, o] of r.references.entries()) {
          const x = M + i * (cw + gap);
          await fitImage(o.src, x, top, cw, ih, 700);
          const chosen = !s.defaulted && o.id === s.option.id;
          if (chosen) { doc.setDrawColor(...ACC); doc.setLineWidth(0.8); doc.rect(x, top, cw, ih); doc.setLineWidth(0.2); }
          let y = text(`Option ${o.option}${chosen ? "  (chosen)" : ""}`, x, top + ih + 5, { size: 9, bold: true, color: chosen ? ACC : INK });
          y = text(o.takeaway || "", x, y + 0.5, { size: 7.5, maxW: cw }) + 1;
          palette(o.palette, x, y, cw); y += 4.5;
          detailBlock(o, x, y, cw, 6.8);
        }
      }
      footer(page);
    }
    doc.save(`${baseName()}${selectedOnly ? ".selected" : ""}.pdf`);
    toast(`PDF saved · ${page} pages`);
  } catch (err) {
    console.error(err); toast("PDF export failed — see the console");
  } finally {
    btn.classList.remove("busy"); btn.textContent = "Export ▾";
  }
}

function readFile(f){ f.text().then(t => { try { load(JSON.parse(t), f.name); } catch { fail("That file is not valid JSON."); } }); }
$("#file").addEventListener("change", e => e.target.files[0] && readFile(e.target.files[0]));
document.addEventListener("dragover", e => { e.preventDefault(); $("#drop")?.classList.add("drag"); });
document.addEventListener("dragleave", () => $("#drop")?.classList.remove("drag"));
document.addEventListener("drop", e => { e.preventDefault(); const f = e.dataTransfer.files[0]; if (f) readFile(f); });
