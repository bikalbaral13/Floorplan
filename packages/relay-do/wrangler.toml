name = "bpluss-relay"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Extra editor origins allowed to open a tab socket (localhost and floorplan-*.vercel.app are always allowed).
[vars]
ALLOWED_ORIGINS = "https://floorplan-indol.vercel.app"

# RELAY_DO_SECRET is a secret, not a var:  npx wrangler secret put RELAY_DO_SECRET
# For `wrangler dev`, put it in packages/relay-do/.dev.vars (git-ignored):  RELAY_DO_SECRET=dev-secret

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
