<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Parametric Staircase</title>
<style>
  :root { --bg:#f8fafc; --panel:#fff; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0; --accent:#0f766e; }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.4 ui-sans-serif,system-ui,Segoe UI,Roboto,sans-serif; color:var(--ink); background:var(--bg); }
  .wrap { display:grid; grid-template-columns:280px 1fr; gap:16px; padding:16px; max-width:1100px; margin:0 auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
  h1 { font-size:15px; margin:0 0 2px; }
  .sub { color:var(--mut); font-size:11px; margin:0 0 12px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:8px; margin:9px 0; }
  .row label { color:var(--mut); font-size:11px; }
  .row .val { font:11px ui-monospace,monospace; color:var(--accent); min-width:46px; text-align:right; }
  input[type=range] { width:120px; accent-color:var(--accent); }
  input[type=number] { width:74px; }
  select, input[type=number] { font:11px ui-monospace,monospace; padding:3px 5px; border:1px solid var(--line); border-radius:6px; background:#fff; }
  input[type=color] { width:34px; height:24px; padding:0; border:1px solid var(--line); border-radius:6px; background:#fff; }
  .views { display:flex; flex-direction:column; gap:14px; }
  .view { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .view h2 { font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--mut); margin:0 0 6px; }
  svg { width:100%; height:auto; display:block; background:#fff; border-radius:6px; }
  .bar { display:flex; gap:8px; margin-top:10px; }
  button { font-size:11px; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; }
  button:hover { border-color:var(--accent); color:var(--accent); }
  .hint { color:var(--mut); font-size:10px; margin-top:8px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Parametric Staircase</h1>
    <p class="sub">Self-contained. One box model → Plan + Elevation.</p>

    <div class="row"><label>Configuration</label>
      <select id="config">
        <option value="straight">Straight</option>
        <option value="u-shape">U-shape (180°)</option>
        <option value="u-shape-mid">U-shape + mid flight</option>
      </select></div>
    <div class="row"><label>Steps</label><input type="range" id="steps" min="2" max="60" step="1" value="14"><span class="val" id="steps_v"></span></div>
    <div class="row"><label>Tread (going)</label><input type="range" id="tread" min="0.2" max="0.45" step="0.005" value="0.28"><span class="val" id="tread_v"></span></div>
    <div class="row"><label>Riser (rise)</label><input type="range" id="riser" min="0.1" max="0.25" step="0.005" value="0.17"><span class="val" id="riser_v"></span></div>
    <div class="row"><label>Width</label><input type="range" id="width" min="0.6" max="3" step="0.05" value="1"><span class="val" id="width_v"></span></div>
    <div class="row"><label>Direction</label>
      <select id="direction"><option value="ltr">Left → Right</option><option value="rtl">Right → Left</option></select></div>
    <div class="row"><label>Mid / split steps</label><input type="range" id="midSteps" min="0" max="40" step="1" value="0"><span class="val" id="midSteps_v"></span></div>
    <div class="row"><label>Landing depth</label><input type="range" id="landingWidth" min="0.5" max="3" step="0.05" value="1"><span class="val" id="landingWidth_v"></span></div>
    <div class="row"><label>Mid space</label><input type="range" id="midSpace" min="0" max="1" step="0.05" value="0.1"><span class="val" id="midSpace_v"></span></div>
    <div class="row"><label>Landing cuts</label><input type="range" id="landingCuts" min="1" max="10" step="1" value="1"><span class="val" id="landingCuts_v"></span></div>
    <div class="row"><label>Rotation</label><input type="range" id="rotation" min="0" max="360" step="1" value="0"><span class="val" id="rotation_v"></span></div>
    <div class="row"><label>Colour</label><input type="color" id="color" value="#0f766e"></div>

    <div class="bar">
      <button id="reset">Reset</button>
      <button id="dl">Download plan SVG</button>
    </div>
    <p class="hint">Geometry is a faithful port of <code>buildStaircaseBoxes</code>. Plan applies rotation; elevation is the left side projection of the local frame.</p>
  </div>

  <div class="views">
    <div class="view"><h2>Plan (top-down)</h2><svg id="plan" viewBox="0 0 520 360"></svg></div>
    <div class="view"><h2>Left elevation (run × rise)</h2><svg id="elev" viewBox="0 0 520 220"></svg></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const PARAMS = ["config","steps","tread","riser","width","direction","midSteps","landingWidth","midSpace","landingCuts","rotation","color"];
const DEFAULTS = { config:"straight", steps:14, tread:0.28, riser:0.17, width:1, direction:"ltr", midSteps:0, landingWidth:1, midSpace:0.1, landingCuts:1, rotation:0, color:"#0f766e" };

function readParams() {
  const num = (id) => parseFloat($(id).value);
  return {
    config: $("config").value,
    steps: Math.max(2, Math.round(num("steps"))),
    tread: Math.max(0.05, num("tread")),
    riser: Math.max(0.05, num("riser")),
    width: Math.max(0.1, num("width")),
    direction: $("direction").value,
    midSteps: Math.round(num("midSteps")),
    landingWidth: Math.max(0, num("landingWidth")),
    midSpace: Math.max(0, num("midSpace")),
    landingCuts: Math.max(1, Math.round(num("landingCuts"))),
    rotation: num("rotation"),
    color: $("color").value,
  };
}

// ── The model — a faithful port of buildStaircaseBoxes (steps + landings), plus per-flight ascent arrows
//    and U-shape winder landing cuts. Local frame: X = run (signed by dir), Y = cross/width, H = rise. ──
function buildModel(s) {
  const N=s.steps, T=s.tread, W=s.width, L=s.landingWidth, G=s.midSpace, R=s.riser, MS=s.midSteps;
  const dir = s.direction === "rtl" ? -1 : 1;
  const boxes=[], arrows=[], cuts=[];
  const box=(x0,x1,y0,y1,h1)=>boxes.push({x0,x1,y0,y1,h0:0,h1});
  const arrow=(x0,y0,x1,y1)=>arrows.push({x0,y0,x1,y1});

  if (s.config === "straight") {
    for (let i=0;i<N;i++) box(dir*i*T, dir*(i+1)*T, 0, W, (i+1)*R);
    if (L>0) box(dir*N*T, dir*(N*T+L), 0, W, N*R);
    arrow(0, W/2, dir*N*T, W/2);
  } else if (s.config === "u-shape") {
    const n1 = (MS>0 && MS<N) ? MS : Math.floor(N/2);
    const n2 = N-n1;
    const xt = dir*n1*T, xl = xt + dir*L;
    for (let i=0;i<n1;i++) box(dir*i*T, dir*(i+1)*T, 0, W, (i+1)*R);
    box(xt, xl, 0, 2*W+G, n1*R);
    for (let j=0;j<n2;j++) box(xt - dir*j*T, xt - dir*(j+1)*T, W+G, 2*W+G, (n1+j+1)*R);
    arrow(0, W/2, xt, W/2);
    arrow(xt, W+G+W/2, xt - dir*n2*T, W+G+W/2);
    // Winder cuts: (landingCuts-1) lines fanning from the inner corner to the landing's far edge.
    const cx = xt, cy = W + G/2;                         // inner corner where the flights meet
    const farX = xl;                                     // far edge of the landing (along run)
    const nc = s.landingCuts;
    for (let k=1;k<nc;k++) { const fy = (k/nc) * (2*W+G); cuts.push({x0:cx,y0:cy,x1:farX,y1:fy}); }
  } else {
    const mid = (MS>0 && MS<N-1) ? MS : Math.max(1, Math.round(N/3));
    const rem = Math.max(2, N-mid);
    const a = Math.ceil(rem/2), b = rem-a;
    const xt = dir*a*T, xr = xt + dir*W;
    const y2 = W + mid*T, y3 = y2 + W;
    for (let i=0;i<a;i++) box(dir*i*T, dir*(i+1)*T, 0, W, (i+1)*R);
    box(xt, xr, 0, W, a*R);
    for (let k=0;k<mid;k++) box(xt, xr, W+k*T, W+(k+1)*T, (a+k+1)*R);
    box(xt, xr, y2, y3, (a+mid)*R);
    for (let j=0;j<b;j++) box(xt - dir*j*T, xt - dir*(j+1)*T, y2, y3, (a+mid+j+1)*R);
    arrow(0, W/2, xt, W/2);
    arrow((xt+xr)/2, W, (xt+xr)/2, W+mid*T);
    arrow(xt, (y2+y3)/2, xt - dir*b*T, (y2+y3)/2);
  }
  return { boxes, arrows, cuts };
}

// Fit a set of (u,v) points into a w×h viewBox with padding; returns a metre→px mapper.
function fitter(pts, w, h, pad) {
  const us=pts.map(p=>p.u), vs=pts.map(p=>p.v);
  const minu=Math.min(...us), maxu=Math.max(...us), minv=Math.min(...vs), maxv=Math.max(...vs);
  const span = (m)=>Math.max(1e-6, m);
  const s = Math.min((w-2*pad)/span(maxu-minu), (h-2*pad)/span(maxv-minv));
  const ox = pad + (w-2*pad - (maxu-minu)*s)/2;
  const oy = pad + (h-2*pad - (maxv-minv)*s)/2;
  return (u,v)=>({ x: ox + (u-minu)*s, y: oy + (v-minv)*s });
}

function rot(p, deg) { const t=deg*Math.PI/180, c=Math.cos(t), s=Math.sin(t); return { x:p.x*c - p.y*s, y:p.x*s + p.y*c }; }

function arrowSvg(M, a, color) {
  const p0=M(a.u0,a.v0), p1=M(a.u1,a.v1);
  const ang=Math.atan2(p1.y-p0.y, p1.x-p0.x), hl=7;
  const hx=p1.x-hl*Math.cos(ang), hy=p1.y-hl*Math.sin(ang), w=4;
  const lx=hx - w*Math.sin(ang), ly=hy + w*Math.cos(ang), rx=hx + w*Math.sin(ang), ry=hy - w*Math.cos(ang);
  return `<line x1="${p0.x.toFixed(1)}" y1="${p0.y.toFixed(1)}" x2="${p1.x.toFixed(1)}" y2="${p1.y.toFixed(1)}" stroke="${color}" stroke-width="1.3"/>`
    + `<polygon points="${p1.x.toFixed(1)},${p1.y.toFixed(1)} ${lx.toFixed(1)},${ly.toFixed(1)} ${rx.toFixed(1)},${ry.toFixed(1)}" fill="${color}"/>`;
}

function renderPlan(model, s) {
  const W=520, H=360, pad=24;
  // Rotate every box footprint + arrows + cuts about the node origin.
  const polys = model.boxes.map(b => [ {x:b.x0,y:b.y0},{x:b.x1,y:b.y0},{x:b.x1,y:b.y1},{x:b.x0,y:b.y1} ].map(p=>rot(p, s.rotation)));
  const arr = model.arrows.map(a => { const p0=rot({x:a.x0,y:a.y0}, s.rotation), p1=rot({x:a.x1,y:a.y1}, s.rotation); return {u0:p0.x,v0:p0.y,u1:p1.x,v1:p1.y}; });
  const cut = model.cuts.map(c => { const p0=rot({x:c.x0,y:c.y0}, s.rotation), p1=rot({x:c.x1,y:c.y1}, s.rotation); return {u0:p0.x,v0:p0.y,u1:p1.x,v1:p1.y}; });
  const allPts=[]; polys.forEach(pl=>pl.forEach(p=>allPts.push({u:p.x,v:p.y}))); arr.forEach(a=>{allPts.push({u:a.u0,v:a.v0},{u:a.u1,v:a.v1});});
  const M = fitter(allPts.length?allPts:[{u:0,v:0},{u:1,v:1}], W, H, pad);
  const fill = s.color + "22";
  let svg="";
  for (const pl of polys) {
    const pts = pl.map(p=>{const q=M(p.x,p.y); return `${q.x.toFixed(1)},${q.y.toFixed(1)}`;}).join(" ");
    svg += `<polygon points="${pts}" fill="${fill}" stroke="${s.color}" stroke-width="1"/>`;
  }
  for (const c of cut) { const p0=M(c.u0,c.v0), p1=M(c.u1,c.v1); svg += `<line x1="${p0.x.toFixed(1)}" y1="${p0.y.toFixed(1)}" x2="${p1.x.toFixed(1)}" y2="${p1.y.toFixed(1)}" stroke="${s.color}" stroke-width="0.8" stroke-dasharray="3 2"/>`; }
  for (const a of arr) svg += arrowSvg((u,v)=>M(u,v), a, s.color);
  $("plan").innerHTML = svg;
}

function renderElev(model, s) {
  const W=520, H=220, pad=20;
  // Left elevation: u = x (run), v = -h (up). Solid columns overlap into the stepped profile.
  const rects = model.boxes.map(b => ({ x0:Math.min(b.x0,b.x1), x1:Math.max(b.x0,b.x1), h:b.h1 }));
  const pts=[]; rects.forEach(r=>{ pts.push({u:r.x0,v:0},{u:r.x1,v:-r.h}); });
  const M = fitter(pts.length?pts:[{u:0,v:0},{u:1,v:-1}], W, H, pad);
  const fill = s.color + "22";
  let svg="";
  for (const r of rects) {
    const a=M(r.x0,0), c=M(r.x1,-r.h);
    const x=Math.min(a.x,c.x), y=Math.min(a.y,c.y), w=Math.abs(c.x-a.x), h=Math.abs(c.y-a.y);
    svg += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" fill="${fill}" stroke="${s.color}" stroke-width="1"/>`;
  }
  $("elev").innerHTML = svg;
}

function render() {
  const s = readParams();
  PARAMS.forEach(id => { const v=$(id+"_v"); if (v) v.textContent = (id==="rotation") ? Math.round(s[id])+"°" : String(s[id]); });
  const model = buildModel(s);
  renderPlan(model, s);
  renderElev(model, s);
}

PARAMS.forEach(id => $(id).addEventListener("input", render));
$("reset").addEventListener("click", () => { Object.entries(DEFAULTS).forEach(([k,v])=>$(k).value=v); render(); });
$("dl").addEventListener("click", () => {
  const svg = $("plan").outerHTML;
  const blob = new Blob([`<?xml version="1.0"?>\n`+svg], {type:"image/svg+xml"});
  const a = document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="staircase-plan.svg"; a.click();
});
render();
</script>
</body>
</html>
